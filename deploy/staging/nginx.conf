map $http_upgrade $barghsa_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name stg.barghsa.com;
    root /var/www/barghsa-acme;
    location ^~ /.well-known/acme-challenge/ { try_files $uri =404; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name stg.barghsa.com;
    ssl_certificate /etc/letsencrypt/live/stg.barghsa.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stg.barghsa.com/privkey.pem;
    server_tokens off;
    client_max_body_size 61m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    location ^~ /api/ {
        include /etc/nginx/snippets/barghsa-api-proxy.conf;
    }
    location = /barghsa-staging {
        include /etc/nginx/snippets/barghsa-s3-proxy.conf;
    }
    location ^~ /barghsa-staging/ {
        include /etc/nginx/snippets/barghsa-s3-proxy.conf;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $barghsa_connection_upgrade;
    }
}
