map $http_upgrade $barghsa_connection_upgrade {
    default upgrade;
    '' close;
}

map $uri $barghsa_log_path {
    default /web;
    /api/health/live /api/health/live;
    /api/health/ready /api/health/ready;
    /api/auth/sessions/context /api/auth/sessions/context;
    /api/auth/sessions/revoke-all /api/auth/sessions/revoke-all;
    ~*^/api/auth/sessions/.+ /api/auth/sessions/:id;
    ~^/api/auth/ /api/auth;
    ~^/api/upload/ /api/upload;
    ~^/api/ai/ /api/ai;
    ~^/api/ /api;
    /barghsa-staging /storage;
    ~^/barghsa-staging/ /storage;
    ~^/__staging/payment/ /__staging/payment;
}
log_format barghsa_privacy escape=json '{"time":"$time_iso8601","route":"$barghsa_log_path",'
    '"method":"$request_method","status":"$status","bytes":"$body_bytes_sent",'
    '"duration":"$request_time","upstream_status":"$upstream_status"}';

# Coarse edge protection; durable account/destination quotas remain in the API.
limit_req_zone $binary_remote_addr zone=barghsa_staging_auth:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=barghsa_staging_upload:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=barghsa_staging_ai:10m rate=5r/s;
map $http_accept_language $barghsa_staging_rate_limit_body {
    default '{"error":{"code":"RATE_LIMIT:EXCEEDED","message":"Too many requests. Please try again in 1 second.","retryAfterSeconds":1}}';
    ~*^fa '{"error":{"code":"RATE_LIMIT:EXCEEDED","message":"تعداد درخواست‌ها بیش از حد مجاز است. لطفاً ۱ ثانیه دیگر تلاش کنید.","retryAfterSeconds":1}}';
}

server {
    listen 80;
    server_name stg.barghsa.com;
    access_log /var/log/nginx/access.log barghsa_privacy;
    error_log /dev/null;
    root /var/www/barghsa-acme;
    location ^~ /.well-known/acme-challenge/ { try_files $uri =404; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2 default_server;
    server_name stg.barghsa.com;
    access_log /var/log/nginx/access.log barghsa_privacy;
    # The access record carries status and timing without Nginx request error text.
    error_log /dev/null;
    ssl_certificate /etc/letsencrypt/live/stg.barghsa.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stg.barghsa.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    server_tokens off;
    client_max_body_size 61m;
    client_header_timeout 60s;
    client_body_timeout 60s;
    large_client_header_buffers 4 8k;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy 'camera=(), microphone=(), geolocation=()' always;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Strict-Transport-Security;

    location ^~ /api/auth/ {
        limit_req zone=barghsa_staging_auth burst=5 nodelay;
        limit_req_status 429;
        error_page 429 @barghsa_staging_limited;
        include /etc/nginx/snippets/barghsa-api-proxy.conf;
    }
    location ^~ /api/upload/ {
        limit_req zone=barghsa_staging_upload burst=3 nodelay;
        limit_req_status 429;
        error_page 429 @barghsa_staging_limited;
        include /etc/nginx/snippets/barghsa-api-proxy.conf;
    }
    location ^~ /api/ai/ {
        limit_req zone=barghsa_staging_ai burst=2 nodelay;
        limit_req_status 429;
        error_page 429 @barghsa_staging_limited;
        include /etc/nginx/snippets/barghsa-api-proxy.conf;
    }
    location @barghsa_staging_limited {
        default_type application/json;
        add_header Retry-After 1 always;
        add_header Cache-Control "private, no-store" always;
        # Local headers replace server-level inheritance in NGINX.
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy 'camera=(), microphone=(), geolocation=()' always;
        return 429 $barghsa_staging_rate_limit_body;
    }
    location ^~ /api/ {
        include /etc/nginx/snippets/barghsa-api-proxy.conf;
    }
    location ^~ /__staging/payment/ {
        client_max_body_size 16k;
        limit_req zone=barghsa_staging_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:9096;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
    }
    location = /barghsa-staging {
        include /etc/nginx/snippets/barghsa-s3-proxy.conf;
    }
    location ^~ /barghsa-staging/ {
        include /etc/nginx/snippets/barghsa-s3-proxy.conf;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $barghsa_connection_upgrade;
    }
}
