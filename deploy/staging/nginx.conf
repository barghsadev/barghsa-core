map $http_upgrade $barghsa_connection_upgrade {
    default upgrade;
    '' close;
}

# Coarse edge protection; durable account/destination quotas remain in the API.
limit_req_zone $binary_remote_addr zone=barghsa_staging_auth:10m rate=10r/s;
map $http_accept_language $barghsa_staging_rate_limit_body {
    default '{"error":{"code":"RATE_LIMIT:EXCEEDED","message":"Too many requests. Please try again in 1 second.","retryAfterSeconds":1}}';
    ~*^fa '{"error":{"code":"RATE_LIMIT:EXCEEDED","message":"تعداد درخواست‌ها بیش از حد مجاز است. لطفاً ۱ ثانیه دیگر تلاش کنید.","retryAfterSeconds":1}}';
}

server {
    listen 80;
    server_name stg.barghsa.com;
    root /var/www/barghsa-acme;
    location ^~ /.well-known/acme-challenge/ { try_files $uri =404; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name stg.barghsa.com;
    ssl_certificate /etc/letsencrypt/live/stg.barghsa.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stg.barghsa.com/privkey.pem;
    server_tokens off;
    client_max_body_size 61m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    location ^~ /api/auth/ {
        limit_req zone=barghsa_staging_auth burst=5 nodelay;
        limit_req_status 429;
        error_page 429 @barghsa_staging_auth_limited;
        include /etc/nginx/snippets/barghsa-api-proxy.conf;
    }
    location @barghsa_staging_auth_limited {
        default_type application/json;
        add_header Retry-After 1 always;
        add_header Cache-Control "private, no-store" always;
        # Local headers replace server-level inheritance in NGINX.
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        return 429 $barghsa_staging_rate_limit_body;
    }
    location ^~ /api/ {
        include /etc/nginx/snippets/barghsa-api-proxy.conf;
    }
    location = /barghsa-staging {
        include /etc/nginx/snippets/barghsa-s3-proxy.conf;
    }
    location ^~ /barghsa-staging/ {
        include /etc/nginx/snippets/barghsa-s3-proxy.conf;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $barghsa_connection_upgrade;
    }
}
