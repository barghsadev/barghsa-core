# Small staging host; tune from measurements before production use.
listen_addresses = '*'
max_connections = 60
shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 8MB
maintenance_work_mem = 128MB
wal_level = replica
archive_mode = off
max_wal_size = 1GB
min_wal_size = 128MB
checkpoint_completion_target = 0.9
shared_preload_libraries = 'pg_stat_statements'
