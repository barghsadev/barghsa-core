name: barghsa-staging-payment
services:
  sandbox:
    image: ${BARGHSA_APP_IMAGE:?Set the existing accepted immutable Node application image}
    pull_policy: never
    command: [node, /sandbox/payment-sandbox.mjs]
    env_file: ${BARGHSA_PAYMENT_SANDBOX_ENV_FILE:-/etc/barghsa/staging/payment-sandbox.env}
    volumes:
      - ${BARGHSA_PAYMENT_SANDBOX_SOURCE:?Set the reviewed immutable sandbox source}:/sandbox/payment-sandbox.mjs:ro
      - /var/lib/barghsa/staging-payment-sandbox:/data
    ports: ['127.0.0.1:9096:9096']
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:9096/__staging/payment/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 20s
    mem_limit: 128m
    networks: [private]
networks:
  private:
    external: true
    name: barghsa-staging-private
