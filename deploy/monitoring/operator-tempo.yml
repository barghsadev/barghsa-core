multitenancy_enabled: true
stream_over_http_enabled: true
server:
  http_listen_port: 3200
distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
storage:
  trace:
    backend: s3
    wal:
      path: /var/tempo/wal
    s3:
      bucket: ${BARGHSA_TEMPO_S3_BUCKET}
      endpoint: ${BARGHSA_TEMPO_S3_ENDPOINT}
      access_key: ${BARGHSA_TEMPO_S3_ACCESS_KEY}
      secret_key: ${BARGHSA_TEMPO_S3_SECRET_KEY}
      forcepathstyle: true
      insecure: false
backend_scheduler:
  provider:
    retention:
      interval: 15m
    compaction:
      compaction:
        block_retention: 168h
backend_worker:
  compaction:
    block_retention: 168h
overrides:
  per_tenant_override_config: /etc/tempo/operator-tempo-overrides.yml
  defaults:
    ingestion:
      burst_size_bytes: 4000000
      rate_limit_bytes: 2000000
      max_traces_per_user: 10000
    global:
      max_bytes_per_trace: 1048576
usage_report:
  reporting_enabled: false
