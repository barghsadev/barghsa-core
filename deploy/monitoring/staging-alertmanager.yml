route:
  receiver: barghsa-operations
  group_by: [alertname, environment, database]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h
receivers:
  - name: barghsa-operations
    webhook_configs:
      - url: http://operations:9094/operations/alerts
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /run/secrets/operations-webhook-token
inhibit_rules:
  - source_matchers: ['alertname="NotificationDeadLettersAccumulating"']
    target_matchers: ['alertname="NotificationDeadLettersPending"']
    equal: [environment, database]
