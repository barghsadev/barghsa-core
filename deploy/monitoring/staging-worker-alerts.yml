groups:
  - name: barghsa-staging-worker
    rules:
      - alert: WorkerUnavailable
        expr: up{job="barghsa-worker"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          runbook_url: https://github.com/barghsadev/barghsa-core/blob/main/docs/runbooks/notification-outage.md
          summary: Background worker cannot be scraped
