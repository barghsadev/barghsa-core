{
  "rule_files": [
    "notification-alerts.yml"
  ],
  "evaluation_interval": "1m",
  "tests": [
    {
      "name": "Empty queue remains quiet",
      "interval": "1m",
      "input_series": [
        {
          "series": "notifications_dead_letter_count{job=\"worker\",environment=\"prod\",instance=\"a\",pod=\"a\"}",
          "values": "0+0x30"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "30m",
          "alertname": "NotificationDeadLettersPending",
          "exp_alerts": []
        },
        {
          "eval_time": "30m",
          "alertname": "NotificationDeadLettersAccumulating",
          "exp_alerts": []
        }
      ]
    },
    {
      "name": "Small backlog waits ten minutes and clears when resolved",
      "interval": "1m",
      "input_series": [
        {
          "series": "notifications_dead_letter_count{job=\"worker\",environment=\"prod\",instance=\"a\",pod=\"a\"}",
          "values": "1+0x10 0+0x5"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "9m",
          "alertname": "NotificationDeadLettersPending",
          "exp_alerts": []
        },
        {
          "eval_time": "10m",
          "alertname": "NotificationDeadLettersPending",
          "exp_alerts": [
            {
              "exp_labels": {
                "job": "worker",
                "environment": "prod",
                "severity": "warning"
              },
              "exp_annotations": {
                "summary": "Notification failures need triage",
                "description": "1 notification deliveries remain open in the dead-letter queue. Inspect attempt history at /admin/failed-notifications before retrying."
              }
            }
          ]
        },
        {
          "eval_time": "10m",
          "alertname": "NotificationDeadLettersAccumulating",
          "exp_alerts": []
        },
        {
          "eval_time": "11m",
          "alertname": "NotificationDeadLettersPending",
          "exp_alerts": []
        }
      ]
    },
    {
      "name": "Replica gauges are not summed across critical threshold",
      "interval": "1m",
      "input_series": [
        {
          "series": "notifications_dead_letter_count{job=\"worker\",environment=\"prod\",instance=\"a\",pod=\"a\"}",
          "values": "19+0x5 20+0x10"
        },
        {
          "series": "notifications_dead_letter_count{job=\"worker\",environment=\"prod\",instance=\"b\",pod=\"b\"}",
          "values": "19+0x5 20+0x10"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "5m",
          "alertname": "NotificationDeadLettersAccumulating",
          "exp_alerts": []
        },
        {
          "eval_time": "10m",
          "alertname": "NotificationDeadLettersAccumulating",
          "exp_alerts": []
        },
        {
          "eval_time": "11m",
          "alertname": "NotificationDeadLettersAccumulating",
          "exp_alerts": [
            {
              "exp_labels": {
                "job": "worker",
                "environment": "prod",
                "severity": "critical"
              },
              "exp_annotations": {
                "summary": "Notification failures are accumulating",
                "description": "20 notification deliveries remain open in the dead-letter queue. Check provider health, worker errors and delivery history. Do not bulk retry before the cause is fixed."
              }
            }
          ]
        }
      ]
    },
    {
      "name": "Short spike does not fire",
      "interval": "1m",
      "input_series": [
        {
          "series": "notifications_dead_letter_count{job=\"worker\",environment=\"prod\",instance=\"a\",pod=\"a\"}",
          "values": "20+0x3 0+0x15"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "5m",
          "alertname": "NotificationDeadLettersAccumulating",
          "exp_alerts": []
        },
        {
          "eval_time": "10m",
          "alertname": "NotificationDeadLettersPending",
          "exp_alerts": []
        }
      ]
    },
    {
      "name": "Environments stay distinct",
      "interval": "1m",
      "input_series": [
        {
          "series": "notifications_dead_letter_count{job=\"worker\",environment=\"prod\",instance=\"a\",pod=\"a\"}",
          "values": "25+0x15"
        },
        {
          "series": "notifications_dead_letter_count{job=\"worker\",environment=\"staging\",instance=\"b\",pod=\"b\"}",
          "values": "1+0x15"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "5m",
          "alertname": "NotificationDeadLettersAccumulating",
          "exp_alerts": [
            {
              "exp_labels": {
                "job": "worker",
                "environment": "prod",
                "severity": "critical"
              },
              "exp_annotations": {
                "summary": "Notification failures are accumulating",
                "description": "25 notification deliveries remain open in the dead-letter queue. Check provider health, worker errors and delivery history. Do not bulk retry before the cause is fixed."
              }
            }
          ]
        },
        {
          "eval_time": "10m",
          "alertname": "NotificationDeadLettersPending",
          "exp_alerts": [
            {
              "exp_labels": {
                "job": "worker",
                "environment": "prod",
                "severity": "warning"
              },
              "exp_annotations": {
                "summary": "Notification failures need triage",
                "description": "25 notification deliveries remain open in the dead-letter queue. Inspect attempt history at /admin/failed-notifications before retrying."
              }
            },
            {
              "exp_labels": {
                "job": "worker",
                "environment": "staging",
                "severity": "warning"
              },
              "exp_annotations": {
                "summary": "Notification failures need triage",
                "description": "1 notification deliveries remain open in the dead-letter queue. Inspect attempt history at /admin/failed-notifications before retrying."
              }
            }
          ]
        }
      ]
    },
    {
      "name": "Missing samples are not fabricated queue counts",
      "interval": "1m",
      "input_series": [],
      "alert_rule_test": [
        {
          "eval_time": "30m",
          "alertname": "NotificationDeadLettersPending",
          "exp_alerts": []
        },
        {
          "eval_time": "30m",
          "alertname": "NotificationDeadLettersAccumulating",
          "exp_alerts": []
        }
      ]
    }
  ]
}
