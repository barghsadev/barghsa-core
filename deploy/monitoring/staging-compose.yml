name: barghsa-staging-monitoring
services:
  prometheus:
    image: ${BARGHSA_PROMETHEUS_IMAGE:?Set a verified immutable Prometheus image}
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.retention.time=15d]
    volumes:
      - ./staging-prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./notification-alerts.yml:/etc/prometheus/notification-alerts.yml:ro
      - ./staging-worker-alerts.yml:/etc/prometheus/staging-worker-alerts.yml:ro
      - prometheusdata:/prometheus
    ports: ['127.0.0.1:9095:9090']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    mem_limit: 512m
    networks: [private]
  alertmanager:
    image: ${BARGHSA_ALERTMANAGER_IMAGE:?Set a verified immutable Alertmanager image}
    command: [--config.file=/etc/alertmanager/alertmanager.yml, --cluster.listen-address=]
    volumes:
      - ./staging-alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - /etc/barghsa/staging/operations-webhook-token:/run/secrets/operations-webhook-token:ro
      - alertmanagerdata:/alertmanager
    ports: ['127.0.0.1:9093:9093']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    mem_limit: 128m
    networks: [private]
  operations:
    image: ${BARGHSA_APP_IMAGE:?Set the accepted immutable application image}
    pull_policy: never
    command: [node, worker/dist/operations/server.js]
    env_file: ${BARGHSA_OPERATIONS_ENV_FILE:-/etc/barghsa/staging/operations.env}
    environment:
      NODE_ENV: production
      OPS_ALERT_PORT: '9094'
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:9094/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 20s
    mem_limit: 128m
    networks: [private]
networks:
  private:
    external: true
    name: barghsa-staging-private
volumes:
  prometheusdata:
  alertmanagerdata:
