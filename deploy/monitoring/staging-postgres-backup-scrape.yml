scrape_configs:
  - job_name: barghsa-postgres-backup
    scheme: https
    follow_redirects: false
    tls_config:
      ca_file: /run/postgres-backup/ca.pem
      cert_file: /run/postgres-backup/client.pem
      key_file: /run/postgres-backup/client-key.pem
    params:
      collect[]: [textfile]
    file_sd_configs:
      - files: [/run/postgres-backup/targets.yml]
    relabel_configs:
      - target_label: environment
        replacement: staging
      - target_label: database
        replacement: core
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'barghsa_postgres_backup_last_(job_success|job_timestamp_seconds|verified_timestamp_seconds)'
        action: keep
