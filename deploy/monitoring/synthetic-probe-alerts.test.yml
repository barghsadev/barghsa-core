rule_files: [staging-synthetic-expectation.yml, synthetic-probe-alerts.yml]
evaluation_interval: 1m
group_eval_order: [barghsa-staging-synthetic-expectation, barghsa-synthetic]
tests:
  - name: An enabled probe pages when discovery loses the target and clears when it returns
    interval: 1m
    input_series:
      - series: 'up{job="barghsa-synthetic",instance="runner",environment="staging",database="core"}'
        values: '1 1 stale _ _ _ 1 1'
      - series: 'barghsa_synthetic_probe_completed_timestamp_seconds{job="barghsa-synthetic",instance="runner",environment="staging",database="core"}'
        values: '0 60 stale _ _ _ 360 420'
      - series: 'up{job="barghsa-synthetic",instance="other",environment="staging",database="other"}'
        values: '1+0x7'
      - series: 'barghsa_synthetic_probe_completed_timestamp_seconds{job="barghsa-synthetic",instance="other",environment="staging",database="other"}'
        values: '0+60x7'
      - series: 'up{job="barghsa-api",instance="api",environment="staging",database="core"}'
        values: '1+0x7'
    alert_rule_test:
      - eval_time: 3m
        alertname: SyntheticProbeUnavailable
        exp_alerts: []
      - eval_time: 4m
        alertname: SyntheticProbeUnavailable
        exp_alerts:
          - exp_labels:
              environment: staging
              database: core
              severity: critical
              priority: P1
            exp_annotations:
              summary: The independent synthetic runner stopped reporting
              dashboard_uid: barghsa-executive-slo
              runbook_url: https://github.com/barghsadev/barghsa-core/blob/main/docs/runbooks/journey-availability.md
      - eval_time: 6m
        alertname: SyntheticProbeUnavailable
        exp_alerts: []
  - name: A verified certificate crosses the threshold once per scope and clears on loss of evidence or renewal
    interval: 1m
    input_series:
      - series: 'up{job="barghsa-synthetic",instance="runner-a",environment="staging",database="core"}'
        values: '1+0x14'
      - series: 'up{job="barghsa-synthetic",instance="runner-b",environment="staging",database="core"}'
        values: '1+0x12 0 0'
      - series: 'barghsa_synthetic_probe_completed_timestamp_seconds{job="barghsa-synthetic",instance="runner-a",environment="staging",database="core"}'
        values: '0+0x13 840'
      - series: 'barghsa_synthetic_probe_completed_timestamp_seconds{job="barghsa-synthetic",instance="runner-b",environment="staging",database="core"}'
        values: '0+0x14'
      - series: 'barghsa_synthetic_probe_tls_certificate_expiry_timestamp_seconds{job="barghsa-synthetic",instance="runner-a",environment="staging",database="core"}'
        values: '1209660+0x11 3500000+0x2'
      - series: 'barghsa_synthetic_probe_tls_certificate_expiry_timestamp_seconds{job="barghsa-synthetic",instance="runner-b",environment="staging",database="core"}'
        values: '1209660+0x14'
      - series: 'barghsa_synthetic_probe_tls_certificate_expiry_timestamp_seconds{job="barghsa-synthetic",instance="runner-a",environment="production",database="core"}'
        values: '240+0x14'
      - series: 'barghsa_synthetic_probe_tls_certificate_expiry_timestamp_seconds{job="barghsa-synthetic",instance="runner-a",environment="staging",database="other"}'
        values: '0+0x14'
      - series: 'up{job="barghsa-synthetic",instance="runner-a",environment="staging",database="other"}'
        values: '1+0x14'
      - series: 'barghsa_synthetic_probe_completed_timestamp_seconds{job="barghsa-synthetic",instance="runner-a",environment="staging",database="other"}'
        values: '0+0x14'
    alert_rule_test:
      - eval_time: 0m
        alertname: PublicTlsCertificateExpiring
        exp_alerts: []
      - eval_time: 1m
        alertname: PublicTlsCertificateExpiring
        exp_alerts: &certificate_warning
          - exp_labels:
              environment: staging
              database: core
              severity: warning
              priority: P3
            exp_annotations:
              summary: The public HTTPS certificate expires within 14 days
              dashboard_uid: barghsa-executive-slo
              runbook_url: https://github.com/barghsadev/barghsa-core/blob/main/docs/runbooks/journey-availability.md
      - eval_time: 12m
        alertname: PublicTlsCertificateExpiring
        exp_alerts: *certificate_warning
      - eval_time: 13m
        alertname: PublicTlsCertificateExpiring
        exp_alerts: []
      - eval_time: 14m
        alertname: PublicTlsCertificateExpiring
        exp_alerts: []
  - name: A renewed public certificate clears the warning while the runner stays fresh
    interval: 1m
    input_series:
      - series: 'up{job="barghsa-synthetic",instance="runner",environment="staging",database="core"}'
        values: '1 1'
      - series: 'barghsa_synthetic_probe_completed_timestamp_seconds{job="barghsa-synthetic",instance="runner",environment="staging",database="core"}'
        values: '0 60'
      - series: 'barghsa_synthetic_probe_tls_certificate_expiry_timestamp_seconds{job="barghsa-synthetic",instance="runner",environment="staging",database="core"}'
        values: '1209600 3500000'
    alert_rule_test:
      - eval_time: 0m
        alertname: PublicTlsCertificateExpiring
        exp_alerts: *certificate_warning
      - eval_time: 1m
        alertname: PublicTlsCertificateExpiring
        exp_alerts: []
  - name: A disabled scope with no discovered target does not page
    interval: 1m
    input_series:
      - series: 'up{job="barghsa-synthetic",instance="runner",environment="staging",database="core"}'
        values: '1+0x3'
      - series: 'barghsa_synthetic_probe_completed_timestamp_seconds{job="barghsa-synthetic",instance="runner",environment="staging",database="core"}'
        values: '0+60x3'
      - series: 'up{job="barghsa-api",instance="api",environment="production",database="core"}'
        values: '1+0x3'
    alert_rule_test:
      - eval_time: 3m
        alertname: SyntheticProbeUnavailable
        exp_alerts: []
  - name: An executed failure pages after six minutes and clears on recovery
    interval: 1m
    input_series:
      - series: 'up{job="barghsa-synthetic",instance="runner",environment="staging",database="core"}'
        values: '1+0x12'
      - series: 'barghsa_synthetic_probe_completed_timestamp_seconds{job="barghsa-synthetic",instance="runner",environment="staging",database="core"}'
        values: '0+0x4 300+0x4 600+0x2'
      - series: 'barghsa_synthetic_probe_success{job="barghsa-synthetic",instance="runner",environment="staging",database="core",check="login"}'
        values: '0+0x9 1+0x2'
    alert_rule_test:
      - eval_time: 5m
        alertname: SyntheticProbeFailed
        exp_alerts: []
      - eval_time: 7m
        alertname: SyntheticProbeFailed
        exp_alerts:
          - exp_labels:
              job: barghsa-synthetic
              instance: runner
              environment: staging
              database: core
              check: login
              severity: critical
              priority: P1
            exp_annotations:
              summary: The independent synthetic check login keeps failing
              dashboard_uid: barghsa-executive-slo
              runbook_url: https://github.com/barghsadev/barghsa-core/blob/main/docs/runbooks/journey-availability.md
      - eval_time: 10m
        alertname: SyntheticProbeFailed
        exp_alerts: []
      - eval_time: 10m
        alertname: SyntheticProbeUnavailable
        exp_alerts: []
  - name: A stale result cannot hide an outage and clears after a fresh completion
    interval: 1m
    input_series:
      - series: 'up{job="barghsa-synthetic",instance="runner",environment="staging",database="core"}'
        values: '1+0x17'
      - series: 'barghsa_synthetic_probe_completed_timestamp_seconds{job="barghsa-synthetic",instance="runner",environment="staging",database="core"}'
        values: '0+0x15 960+0x1'
      - series: 'barghsa_synthetic_probe_success{job="barghsa-synthetic",instance="runner",environment="staging",database="core",check="login"}'
        values: '1+0x17'
    alert_rule_test:
      - eval_time: 12m
        alertname: SyntheticProbeUnavailable
        exp_alerts: []
      - eval_time: 15m
        alertname: SyntheticProbeUnavailable
        exp_alerts:
          - exp_labels:
              job: barghsa-synthetic
              instance: runner
              environment: staging
              database: core
              severity: critical
              priority: P1
            exp_annotations:
              summary: The independent synthetic runner stopped reporting
              dashboard_uid: barghsa-executive-slo
              runbook_url: https://github.com/barghsadev/barghsa-core/blob/main/docs/runbooks/journey-availability.md
      - eval_time: 16m
        alertname: SyntheticProbeUnavailable
        exp_alerts: []
  - name: Exporter outage pages without replaying a stale failure or foreign result
    interval: 1m
    input_series:
      - series: 'up{job="barghsa-synthetic",instance="runner",environment="staging",database="core"}'
        values: '0+0x7'
      - series: 'up{job="barghsa-synthetic",instance="new",environment="staging",database="core"}'
        values: '1+0x7'
      - series: 'barghsa_synthetic_probe_completed_timestamp_seconds{job="barghsa-synthetic",instance="new",environment="production",database="core"}'
        values: '0+0x4 300+0x2'
      - series: 'barghsa_synthetic_probe_success{job="barghsa-synthetic",instance="runner",environment="staging",database="core",check="login"}'
        values: '0+0x7'
    alert_rule_test:
      - eval_time: 7m
        alertname: SyntheticProbeFailed
        exp_alerts: []
      - eval_time: 2m
        alertname: SyntheticProbeUnavailable
        exp_alerts:
          - exp_labels:
              job: barghsa-synthetic
              instance: new
              environment: staging
              database: core
              severity: critical
              priority: P1
            exp_annotations:
              summary: The independent synthetic runner stopped reporting
              dashboard_uid: barghsa-executive-slo
              runbook_url: https://github.com/barghsadev/barghsa-core/blob/main/docs/runbooks/journey-availability.md
          - exp_labels:
              job: barghsa-synthetic
              instance: runner
              environment: staging
              database: core
              severity: critical
              priority: P1
            exp_annotations:
              summary: The independent synthetic runner stopped reporting
              dashboard_uid: barghsa-executive-slo
              runbook_url: https://github.com/barghsadev/barghsa-core/blob/main/docs/runbooks/journey-availability.md
