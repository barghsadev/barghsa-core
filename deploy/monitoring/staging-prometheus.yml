global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: staging
    database: core
rule_files:
  - /etc/prometheus/notification-alerts.yml
  - /etc/prometheus/staging-worker-alerts.yml
  - /etc/prometheus/journey-slo-alerts.yml
  - /etc/prometheus/api-pressure-alerts.yml
  - /etc/prometheus/synthetic-probe-alerts.yml
  - /etc/prometheus/postgres-backup-alerts.yml
  - /etc/prometheus/optional/*.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
scrape_config_files:
  - /etc/prometheus/optional-scrapes/*.yml
scrape_configs:
  - job_name: barghsa-api
    static_configs:
      - targets: ['barghsa-staging-api-1:4000']
        labels:
          environment: staging
          database: core
          availability_tier: pilot
  - job_name: barghsa-worker
    static_configs:
      - targets: ['barghsa-staging-worker-1:9090']
        labels:
          environment: staging
          database: core
  - job_name: barghsa-synthetic
    scheme: https
    follow_redirects: false
    file_sd_configs:
      - files: [/etc/prometheus/synthetic-targets/staging.yml]
    relabel_configs:
      - target_label: environment
        replacement: staging
      - target_label: database
        replacement: core
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: barghsa_synthetic_probe_(completed_timestamp_seconds|success|tls_certificate_expiry_timestamp_seconds)
        action: keep
