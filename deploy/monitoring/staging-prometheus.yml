global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: staging
    database: core
rule_files: [/etc/prometheus/notification-alerts.yml, /etc/prometheus/staging-worker-alerts.yml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
scrape_configs:
  - job_name: barghsa-worker
    static_configs:
      - targets: ['barghsa-staging-worker-1:9090']
        labels:
          environment: staging
          database: core
