groups:
  - name: barghsa-notification-delivery
    rules:
      - alert: EmailProviderDegraded
        expr: min without (instance, pod) (provider_email_health) == 0
        labels:
          severity: warning
        annotations:
          runbook_url: https://github.com/barghsadev/barghsa-core/blob/main/docs/runbooks/notification-outage.md
          summary: Email provider circuit is open
          description: 'Provider {{ $labels.provider_id }} stopped sending after repeated transient failures. Inspect provider health and delivery history; recovery permits one probe after the configured cooldown.'
          slo_dashboard_uid: barghsa-executive-slo
          journey_burn: &journey_burn >-
            {{- if and $labels.environment $labels.database -}}
            {{- $selector := printf "barghsa:journey:burn_rate{environment=%q,database=%q,window=~\"1h|24h\"}" $labels.environment $labels.database -}}
            {{- with query $selector | sortByLabel "window" | sortByLabel "service" -}}
            {{- range $i, $sample := . -}}
            {{- if $i }}, {{ end -}}
            {{ $sample.Labels.service }}/{{ $sample.Labels.availability_tier }}/{{ $sample.Labels.window }}={{ printf "%.2fx" $sample.Value }}
            {{- end -}}
            {{- else -}}unavailable{{- end -}}
            {{- else -}}unavailable{{- end -}}
      - alert: SmsProviderLowCredit
        expr: max without (instance, pod) (provider_sms_credit_low) == 1
        labels:
          severity: warning
          priority: P2
        annotations:
          runbook_url: https://github.com/barghsadev/barghsa-core/blob/main/docs/runbooks/notification-outage.md
          summary: SMS provider credit is low
          description: 'Provider {{ $labels.provider_id }} is below its configured credit threshold. Review the observed balance and replenish credit in /admin/sms-providers.'
      - alert: SmsProviderCreditReview
        expr: |
          max by (environment, database, provider_id) (provider_sms_credit_review) == 1
          and max by (environment, database, provider_id) (provider_sms_credit_low) == 0
        labels:
          severity: warning
          priority: P3
        annotations:
          runbook_url: https://github.com/barghsadev/barghsa-core/blob/main/docs/runbooks/notification-outage.md
          summary: SMS credit is approaching the configured low-credit threshold
      - alert: SmsProviderDegraded
        expr: min without (instance, pod) (provider_sms_health) == 0
        labels:
          severity: warning
        annotations:
          runbook_url: https://github.com/barghsadev/barghsa-core/blob/main/docs/runbooks/notification-outage.md
          summary: SMS provider circuit is open
          description: 'Provider {{ $labels.provider_id }} stopped sending after provider failures. Inspect its configuration, health and delivery history; a configuration pause requires a tested replacement.'
          slo_dashboard_uid: barghsa-executive-slo
          journey_burn: *journey_burn
      - alert: NotificationDeadLettersPending
        expr: max without (instance, pod) (notifications_dead_letter_count) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          runbook_url: https://github.com/barghsadev/barghsa-core/blob/main/docs/runbooks/notification-outage.md
          summary: Notification failures need triage
          description: '{{ $value }} notification deliveries remain open in the dead-letter queue. Inspect attempt history at /admin/failed-notifications before retrying.'
      - alert: NotificationDeadLettersAccumulating
        expr: max without (instance, pod) (notifications_dead_letter_count) >= 20
        for: 5m
        labels:
          severity: critical
        annotations:
          runbook_url: https://github.com/barghsadev/barghsa-core/blob/main/docs/runbooks/notification-outage.md
          summary: Notification failures are accumulating
          description: '{{ $value }} notification deliveries remain open in the dead-letter queue. Check provider health, worker errors and delivery history. Do not bulk retry before the cause is fixed.'
      - alert: NotificationOutboxBacklog
        expr: max without (instance, pod) (notifications_eligible_outbox_age_seconds) > 300
        labels:
          severity: warning
          priority: P2
        annotations:
          runbook_url: https://github.com/barghsadev/barghsa-core/blob/main/docs/runbooks/notification-outage.md
          summary: Eligible notification outbox backlog exceeds five minutes
          slo_dashboard_uid: barghsa-executive-slo
          journey_burn: *journey_burn
      - alert: NotificationOutboxBacklogCritical
        expr: max without (instance, pod) (notifications_eligible_outbox_age_seconds) > 900
        labels:
          severity: critical
          priority: P1
        annotations:
          runbook_url: https://github.com/barghsadev/barghsa-core/blob/main/docs/runbooks/notification-outage.md
          summary: Eligible notification outbox backlog exceeds fifteen minutes
          slo_dashboard_uid: barghsa-executive-slo
          journey_burn: *journey_burn
  - name: barghsa-refund-obligations
    rules:
      - alert: RefundObligationOverdue
        expr: max without (instance, pod) (refund_obligations_overdue) > 0
        labels:
          severity: warning
          priority: P2
        annotations:
          runbook_url: https://github.com/barghsadev/barghsa-core/blob/main/docs/runbooks/refund-backlog.md
          summary: At least one mandatory refund has remained outstanding for more than one hour
          slo_dashboard_uid: barghsa-executive-slo
          journey_burn: *journey_burn
      - alert: WalletReconciliationCritical
        expr: max without (instance, pod) (reconciliation_wallets_critical_drift) > 0
        labels:
          severity: critical
          priority: P1
        annotations:
          runbook_url: https://github.com/barghsadev/barghsa-core/blob/main/docs/runbooks/payment-wallet-mismatch.md
          summary: Current wallet balance differs from its ledger at or above the critical threshold
          slo_dashboard_uid: barghsa-executive-slo
          journey_burn: *journey_burn
      - alert: WalletReconciliationReview
        expr: |
          max by (environment, database) (reconciliation_mismatches_unresolved) > 0
          and max by (environment, database) (reconciliation_wallets_critical_drift) == 0
        labels:
          severity: warning
          priority: P3
        annotations:
          runbook_url: https://github.com/barghsadev/barghsa-core/blob/main/docs/runbooks/payment-wallet-mismatch.md
          summary: Open reconciliation mismatches need Finance review
      - alert: PaymentCallbackAnomaly
        expr: |
          max without (instance, pod, callback, reason) (
            max_over_time(payment_callback_last_anomaly_timestamp_seconds[5m])
          ) > time() - 300
        labels:
          severity: critical
          priority: P1
        annotations:
          runbook_url: https://github.com/barghsadev/barghsa-core/blob/main/docs/runbooks/payment-wallet-mismatch.md
          summary: A payment callback had an invalid signature, stale timestamp or replayed event ID
      - alert: PaymentIdempotencyConflict
        expr: |
          max without (instance, pod, operation) (
            max_over_time(payment_idempotency_last_conflict_timestamp_seconds[5m])
          ) > time() - 300
        labels:
          severity: critical
          priority: P1
        annotations:
          runbook_url: https://github.com/barghsadev/barghsa-core/blob/main/docs/runbooks/payment-wallet-mismatch.md
          summary: A payment idempotency key was used with conflicting payment data
  - name: barghsa-storage-lifecycle
    rules:
      - alert: ClamAvSignaturesStale
        expr: |
          max by (environment, database) (
            (barghsa_clamav_signature_build_timestamp_seconds{environment=~"staging|production",database!=""} == 0)
            or (time() - barghsa_clamav_signature_build_timestamp_seconds{environment=~"staging|production",database!=""} >= 172800)
            or (barghsa_clamav_signature_build_timestamp_seconds{environment=~"staging|production",database!=""} > time() + 300)
            or (
              up{clamav_signature_monitoring="required",environment=~"staging|production",database!=""} == 1
              unless on (job, instance, environment, database)
                barghsa_clamav_signature_build_timestamp_seconds{environment=~"staging|production",database!=""}
            )
          )
        for: 5m
        labels:
          severity: warning
          priority: P2
        annotations:
          runbook_url: https://github.com/barghsadev/barghsa-core/blob/main/docs/operations/clamav-signatures.md
          dashboard_uid: barghsa-storage-uploads
          summary: Loaded ClamAV signatures are overdue or could not be verified
      - alert: StorageLifecycleNeedsReview
        expr: max by (environment, database) (barghsa_storage_lifecycle_job_needs_review) == 1
        for: 5m
        labels:
          severity: warning
          priority: P3
        annotations:
          runbook_url: https://github.com/barghsadev/barghsa-core/blob/main/docs/runbooks/storage-outage.md
          summary: A storage lifecycle job has an unresolved failure
  - name: barghsa-ai-models
    rules:
      - alert: AiModelCircuitOpen
        expr: min without (instance, pod) (ai_model_health) == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          runbook_url: https://github.com/barghsadev/barghsa-core/blob/main/docs/runbooks/ai-provider-outage.md
          summary: AI model circuit is open
          description: 'Model {{ $labels.model_id }} is temporarily unavailable after repeated provider failures. Review the model in admin; a short recovery probe is allowed after cooldown.'
          slo_dashboard_uid: barghsa-executive-slo
          journey_burn: *journey_burn
