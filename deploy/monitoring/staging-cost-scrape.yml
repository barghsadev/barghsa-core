scrape_configs:
  - job_name: barghsa-monthly-costs
    scrape_interval: 5m
    scrape_timeout: 20s
    metrics_path: /operations/monthly-costs
    follow_redirects: false
    authorization:
      credentials_file: /run/secrets/cost-scrape-token
    static_configs:
      - targets: ['operations:9094']
        labels:
          environment: staging
          database: core
