groups:
  - name: barghsa-postgres-backup
    rules:
      - record: barghsa:postgres_backup_report:valid
        expr: |
          (up{job="barghsa-postgres-backup",environment!="",database!=""} == 1)
          and on (job, instance, environment, database) (
            (barghsa_postgres_backup_last_job_success{job="barghsa-postgres-backup"} == 0)
            or (barghsa_postgres_backup_last_job_success{job="barghsa-postgres-backup"} == 1)
          )
          and on (job, instance, environment, database) (
            (barghsa_postgres_backup_last_job_timestamp_seconds{job="barghsa-postgres-backup"} > 0)
            and (barghsa_postgres_backup_last_job_timestamp_seconds{job="barghsa-postgres-backup"} <= time())
          )
          and on (job, instance, environment, database) (
            (barghsa_postgres_backup_last_verified_timestamp_seconds{job="barghsa-postgres-backup"} >= 0)
            and on (job, instance, environment, database) (
              barghsa_postgres_backup_last_verified_timestamp_seconds{job="barghsa-postgres-backup"}
              <= on (job, instance, environment, database)
              barghsa_postgres_backup_last_job_timestamp_seconds{job="barghsa-postgres-backup"}
            )
          )
      - alert: PostgresBackupFailed
        expr: |
          (barghsa_postgres_backup_last_job_success{job="barghsa-postgres-backup"} == 0)
          and on (job, instance, environment, database) barghsa:postgres_backup_report:valid
        labels:
          severity: critical
          priority: P1
        annotations:
          summary: The last PostgreSQL backup or retention job failed
          dashboard_uid: barghsa-postgresql
          runbook_url: https://github.com/barghsadev/barghsa-core/blob/main/docs/runbooks/postgresql-backup.md
      - alert: PostgresBackupStale
        expr: |
          (
            (barghsa_postgres_backup_last_verified_timestamp_seconds{job="barghsa-postgres-backup"} == 0)
            or (time() - barghsa_postgres_backup_last_verified_timestamp_seconds{job="barghsa-postgres-backup"} >= 86400)
          )
          and on (job, instance, environment, database) barghsa:postgres_backup_report:valid
        for: 2m
        labels:
          severity: critical
          priority: P1
        annotations:
          summary: A verified PostgreSQL backup from the last 24 hours is unavailable
          dashboard_uid: barghsa-postgresql
          runbook_url: https://github.com/barghsadev/barghsa-core/blob/main/docs/runbooks/postgresql-backup.md
      - alert: PostgresBackupMonitoringUnavailable
        expr: |
          (
            up{job="barghsa-postgres-backup",environment!="",database!=""}
            unless on (job, instance, environment, database) barghsa:postgres_backup_report:valid
          )
          or (
            (barghsa:postgres_backup_report:expected{environment!="",database!=""} == 1)
            unless on (environment, database) up{job="barghsa-postgres-backup"}
          )
        for: 2m
        labels:
          severity: critical
          priority: P1
        annotations:
          summary: The PostgreSQL backup monitoring target has no valid report
          dashboard_uid: barghsa-postgresql
          runbook_url: https://github.com/barghsadev/barghsa-core/blob/main/docs/runbooks/postgresql-backup.md
