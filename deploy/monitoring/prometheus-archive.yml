global:
  scrape_interval: 5m

scrape_configs:
  - job_name: barghsa-metrics-archive-source
    metrics_path: /federate
    honor_labels: true
    honor_timestamps: true
    track_timestamps_staleness: true
    follow_redirects: false
    params:
      'match[]':
        - '{environment!="",database!=""}'
    static_configs:
      - targets: ['prometheus:9090']
