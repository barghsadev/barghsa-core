worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  map $server_name $barghsa_scope {
    default app;
    s3.barghsa.com storage;
  }
  log_format barghsa_access escape=json '{"time":"$time_iso8601","scope":"$barghsa_scope",'
    '"method":"$request_method","status":"$status","bytes":"$body_bytes_sent",'
    '"duration":"$request_time","upstream_status":"$upstream_status"}';
  access_log /dev/stdout barghsa_access;
  # Request error lines can include signed URLs and callback credentials.
  # Keep request outcomes in the access log and process errors on stderr.
  error_log /dev/null;
  client_max_body_size 55m;
  proxy_read_timeout 120s;
  proxy_send_timeout 120s;

  server {
    listen 8080 default_server;
    server_name _ app.barghsa.com;
    location /api/ {
      proxy_pass http://127.0.0.1:4000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
    location / {
      proxy_pass http://127.0.0.1:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
  }

  server {
    listen 8080;
    server_name s3.barghsa.com;
    location / {
      proxy_pass http://127.0.0.1:8333;
      proxy_request_buffering off;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
