name: barghsa-production

x-node-service: &node-service
  pull_policy: never
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ['/tmp:size=64m,mode=1777']
  stop_grace_period: 40s
  restart: unless-stopped
  networks: [private]

x-app-image: &app-image '${BARGHSA_APP_REPOSITORY:?Set the app image repository}@sha256:${BARGHSA_APP_DIGEST:?Set the verified app image digest}'

x-db-environment: &db-environment
  NODE_ENV: production
  DATABASE_SSL_ENABLED: 'true'
  DATABASE_SSL_REJECT_UNAUTHORIZED: 'true'
  DATABASE_CA_PATH: /run/secrets/database-ca.pem

x-app-runtime: &app-runtime
  <<: *node-service
  image: *app-image
  env_file: ${BARGHSA_RUNTIME_ENV_FILE:?Set the protected runtime environment file}
  environment: *db-environment
  secrets: [database-ca.pem]

x-app-health: &app-health
  test: [CMD, node, healthcheck-runtime.cjs]
  interval: 30s
  timeout: 10s
  start_period: 40s
  retries: 3

services:
  migrate:
    <<: *node-service
    image: *app-image
    env_file: ${BARGHSA_MIGRATION_ENV_FILE:?Set the separate migration environment file}
    environment:
      <<: *db-environment
      DATABASE_URL: ''
      PGBOUNCER_URL: ''
    secrets: [database-ca.pem]
    command: [node, run-packaged-migrations.cjs]
    healthcheck: { disable: true }
    restart: 'no'

  clamav:
    image: '${BARGHSA_CLAMAV_REPOSITORY:?Set the scanner image repository}@sha256:${BARGHSA_CLAMAV_DIGEST:?Set the verified scanner image digest}'
    pull_policy: never
    volumes: ['clamav-data:/var/lib/clamav']
    healthcheck:
      test: [CMD, /usr/local/bin/barghsa-clamav-healthcheck]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 5
    restart: unless-stopped
    networks: [private]

  ai-inference:
    <<: *app-runtime
    command: [node, worker/dist/ai-inference/main.js]
    environment:
      <<: *db-environment
      AI_INFERENCE_HOST: 0.0.0.0
      AI_INFERENCE_PORT: '9091'
      WORKER_PORT: '9091'
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      <<: *app-health
      test: [CMD, node, worker/healthcheck.js]

  api:
    <<: *app-runtime
    environment:
      <<: *db-environment
      PORT: '4000'
      AI_INFERENCE_URL: http://ai-inference:9091
      DOCUMENT_CLAMAV_HOST: clamav
      DOCUMENT_CLAMAV_PORT: '3310'
    ports: ['127.0.0.1:4000:4000']
    depends_on:
      migrate: { condition: service_completed_successfully }
      clamav: { condition: service_healthy }
      ai-inference: { condition: service_healthy }
    healthcheck: *app-health

  worker:
    <<: *app-runtime
    command: [node, worker/dist/main.js]
    environment:
      <<: *db-environment
      WORKER_PORT: '9090'
      DOCUMENT_CLAMAV_HOST: clamav
      DOCUMENT_CLAMAV_PORT: '3310'
    depends_on:
      migrate: { condition: service_completed_successfully }
      clamav: { condition: service_healthy }
    healthcheck: *app-health

  web:
    <<: *node-service
    image: '${BARGHSA_WEB_REPOSITORY:?Set the web image repository}@sha256:${BARGHSA_WEB_DIGEST:?Set the verified web image digest}'
    environment:
      NODE_ENV: production
      PORT: '3000'
      WEB_CSP_MODE: ${BARGHSA_WEB_CSP_MODE:-report-only}
    ports: ['127.0.0.1:3000:3000']
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      <<: *app-health
      test: [CMD, node, healthcheck.js]

secrets:
  database-ca.pem:
    file: ${BARGHSA_DATABASE_CA_FILE:?Set the approved database and pooler CA bundle}

networks:
  private:

volumes:
  clamav-data:
