# Barghsa Pilot Topology — NGINX Reverse Proxy (alternative)
#
# Single-node pilot NGINX configuration with TLS via cert files.
# Use this as an alternative to the Caddyfile when managed certificates
# are already available or NGINX is the preferred proxy.
#
# This config provides:
#   - HTTP → HTTPS redirection
#   - API routing (location /api/ → NestJS on :4000)
#   - Web SPA routing (location / → TanStack on :3000)
#   - SSE/AI streaming via proxy_buffering off
#   - WebSocket upgrades via Upgrade/Connection headers
#   - Static asset caching (immutable, 1 year for hashed assets)
#   - Gzip compression for text-based assets
#   - Security headers
#   - Request body size limit (10 MB)
#
# Usage:
#   nginx -c /path/to/deploy/pilot/nginx.conf
#
# Dependencies: nginx (>=1.24.0), ssl cert/key files
#
# Upstreams:
#   upstream barghsa_web  — TanStack Start SPA server   127.0.0.1:3000
#   upstream barghsa_api  — NestJS API server            127.0.0.1:4000

worker_processes auto;
pid /var/run/nginx.pid;

events {
	worker_connections 1024;
	multi_accept on;
}

http {
	include       /etc/nginx/mime.types;
	default_type application/octet-stream;

	# ──────────────────────────────────────────────
	# Basic optimisations
	# ──────────────────────────────────────────────
	sendfile on;
	tcp_nopush on;
	tcp_nodelay on;
	keepalive_timeout 65;
	types_hash_max_size 2048;
	server_tokens off;

	# ──────────────────────────────────────────────
	# Logging
	# ──────────────────────────────────────────────
	log_format main '$remote_addr - $remote_user [$time_local] "$request" '
	                '$status $body_bytes_sent "$http_referer" '
	                '"$http_user_agent" "$http_x_forwarded_for"';
	access_log /var/log/nginx/access.log main;
	error_log  /var/log/nginx/error.log warn;

	# ──────────────────────────────────────────────
	# Edge rate limiting zones — defense-in-depth
	# Application-level rate limits remain the primary control
	# ──────────────────────────────────────────────
	limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;
	limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=5r/s;
	limit_req_zone $binary_remote_addr zone=ai_limit:10m rate=5r/s;

	# Custom 429 JSON response
	error_page 429 @rate_limited;

	# ──────────────────────────────────────────────
	# Gzip compression
	# ──────────────────────────────────────────────
	gzip on;
	gzip_vary on;
	gzip_proxied any;
	gzip_comp_level 5;
	gzip_min_length 256;
	gzip_types
		text/plain
		text/css
		application/json
		application/javascript
		text/xml
		application/xml
		application/xml+rss
		text/javascript
		image/svg+xml
		application/manifest+json;

	# ──────────────────────────────────────────────
	# Upstreams
	# ──────────────────────────────────────────────
	upstream barghsa_web {
		server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
	}

	upstream barghsa_api {
		server 127.0.0.1:4000 max_fails=3 fail_timeout=10s;
	}

	# ──────────────────────────────────────────────
	# HTTP server — redirect to HTTPS
	# ──────────────────────────────────────────────
	server {
		listen 80 default_server;
		listen [::]:80 default_server;
		server_name _;

		# Let ACME/Let's Encrypt challenge through
		location /.well-known/acme-challenge/ {
			root /var/www/acme-challenge;
		}

		location / {
			return 301 https://$host$request_uri;
		}
	}

	# ──────────────────────────────────────────────
	# HTTPS server
	# ──────────────────────────────────────────────
	server {
		listen 443 ssl http2 default_server;
		listen [::]:443 ssl http2 default_server;
		server_name barghsa.example.com;

		# ──────────────────────────────────────────────
		# TLS — replace with actual cert paths
		# ──────────────────────────────────────────────
		ssl_certificate     /etc/ssl/certs/barghsa.pem;
		ssl_certificate_key /etc/ssl/private/barghsa.key;
		ssl_protocols       TLSv1.2 TLSv1.3;
		ssl_ciphers         HIGH:!aNULL:!MD5:!SHA1;
		ssl_prefer_server_ciphers on;
		ssl_session_cache   shared:SSL:10m;
		ssl_session_timeout 10m;
		ssl_session_tickets off;

		# HSTS (uncomment after confirming TLS works)
		# HSTS
		add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

		# ──────────────────────────────────────────────
		# Request size limit
		# ──────────────────────────────────────────────
		client_max_body_size 10m;

		# ──────────────────────────────────────────────
		# Security headers (all responses)
		# ──────────────────────────────────────────────
		add_header X-Content-Type-Options "nosniff" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
		add_header X-Frame-Options "DENY" always;
		# Start CSP in Report-Only mode — collect violations before enforcing
		# When all violations are resolved, change to Content-Security-Policy
		add_header Content-Security-Policy-Report-Only "default-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; script-src 'strict-dynamic' 'nonce-$http_csp_nonce' 'unsafe-inline' https: http:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; form-action 'self'; report-uri /api/csp-report" always;

		# ──────────────────────────────────────────────
		# Custom 429 response (rate limiting)
		# ──────────────────────────────────────────────
		location @rate_limited {
			default_type application/json;
			add_header Retry-After "1" always;
			return 429 '{"error":"rate_limit_exceeded","message":"Too many requests. Please try again later."}';
		}

		# ──────────────────────────────────────────────
		# API upstream  —  /api/  →  NestJS on :4000
		# Individual rate-limited paths (order matters — ^~ longest match wins)
		# ──────────────────────────────────────────────

		# Auth endpoints — burst=5, 10r/s
		location ^~ /api/auth/ {
			limit_req zone=auth_limit burst=5 nodelay;
			proxy_pass http://barghsa_api;
			proxy_http_version 1.1;
			proxy_set_header Host               $host;
			proxy_set_header X-Real-IP          $remote_addr;
			proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto  $scheme;
			proxy_buffering         off;
			proxy_cache             off;
			chunked_transfer_encoding on;
			proxy_connect_timeout   5s;
			proxy_send_timeout      60s;
			proxy_read_timeout      60s;
			proxy_next_upstream     error timeout invalid_header http_500 http_502 http_503;
			proxy_next_upstream_tries 2;
		}

		# Upload endpoints — burst=3, 5r/s
		location ^~ /api/upload/ {
			limit_req zone=upload_limit burst=3 nodelay;
			proxy_pass http://barghsa_api;
			proxy_http_version 1.1;
			proxy_set_header Host               $host;
			proxy_set_header X-Real-IP          $remote_addr;
			proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto  $scheme;
			proxy_buffering         off;
			proxy_cache             off;
			chunked_transfer_encoding on;
			proxy_connect_timeout   5s;
			proxy_send_timeout      300s;
			proxy_read_timeout      300s;
			proxy_next_upstream     error timeout invalid_header http_500 http_502 http_503;
			proxy_next_upstream_tries 2;
		}

		# AI streaming endpoints — burst=2, 5r/s
		location ^~ /api/ai/ {
			limit_req zone=ai_limit burst=2 nodelay;
			proxy_pass http://barghsa_api;
			proxy_http_version 1.1;
			proxy_set_header Host               $host;
			proxy_set_header X-Real-IP          $remote_addr;
			proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto  $scheme;
			proxy_buffering         off;
			proxy_cache             off;
			chunked_transfer_encoding on;
			proxy_connect_timeout   5s;
			proxy_send_timeout      300s;
			proxy_read_timeout      300s;
			proxy_next_upstream     error timeout invalid_header http_500 http_502 http_503;
			proxy_next_upstream_tries 2;
		}

		# Other API paths — no edge rate limiting
		location ^~ /api/ {
			proxy_pass http://barghsa_api;
			proxy_http_version 1.1;
			proxy_set_header Host               $host;
			proxy_set_header X-Real-IP          $remote_addr;
			proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto  $scheme;
			proxy_buffering         off;
			proxy_cache             off;
			chunked_transfer_encoding on;
			proxy_connect_timeout   5s;
			proxy_send_timeout      60s;
			proxy_read_timeout      300s;
			proxy_next_upstream     error timeout invalid_header http_500 http_502 http_503;
			proxy_next_upstream_tries 2;
		}

		# ──────────────────────────────────────────────
		# Web upstream  —  /*  →  TanStack SPA on :3000
		# ──────────────────────────────────────────────
		location / {
			proxy_pass http://barghsa_web;
			proxy_http_version 1.1;

			proxy_set_header Host               $host;
			proxy_set_header X-Real-IP          $remote_addr;
			proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto  $scheme;

			# WebSocket support
			proxy_set_header Upgrade            $http_upgrade;
			proxy_set_header Connection         "upgrade";

			# Timeouts
			proxy_connect_timeout   5s;
			proxy_send_timeout      60s;
			proxy_read_timeout      60s;

			# Error handling
			proxy_next_upstream     error timeout invalid_header http_500 http_502 http_503;
			proxy_next_upstream_tries 2;
		}

		# ──────────────────────────────────────────────
		# Static asset caching — /assets/ (hashed filenames)
		# Cache: public, immutable, 1 year
		# CDN: Vary: Accept-Encoding
		# ──────────────────────────────────────────────
		location ~* ^/assets/.+\.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|webp|avif)$ {
			expires 1y;
			add_header Cache-Control "public, immutable, max-age=31536000" always;
			add_header Vary "Accept-Encoding" always;
			add_header X-Content-Type-Options "nosniff" always;
			add_header Referrer-Policy "strict-origin-when-cross-origin" always;
			add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
			add_header X-Frame-Options "DENY" always;
			add_header Content-Security-Policy-Report-Only "default-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; script-src 'strict-dynamic' 'nonce-$http_csp_nonce' 'unsafe-inline' https: http:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; form-action 'self'; report-uri /api/csp-report" always;
			proxy_pass http://barghsa_web;
			proxy_set_header Host               $host;
			proxy_set_header X-Real-IP          $remote_addr;
			proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto  $scheme;
		}

		# ──────────────────────────────────────────────
		# Other static files (non-hashed) — 1-day cache
		# ──────────────────────────────────────────────
		location ~* ^(?!.*/assets/).+\.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|webp|avif)$ {
			expires 1d;
			add_header Cache-Control "public, max-age=86400" always;
			add_header Vary "Accept-Encoding" always;
			add_header X-Content-Type-Options "nosniff" always;
			add_header Referrer-Policy "strict-origin-when-cross-origin" always;
			add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
			add_header X-Frame-Options "DENY" always;
			add_header Content-Security-Policy-Report-Only "default-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; script-src 'strict-dynamic' 'nonce-$http_csp_nonce' 'unsafe-inline' https: http:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; form-action 'self'; report-uri /api/csp-report" always;
			proxy_pass http://barghsa_web;
			proxy_set_header Host               $host;
			proxy_set_header X-Real-IP          $remote_addr;
			proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto  $scheme;
		}

		# ──────────────────────────────────────────────
		# HTML documents — no caching (SPA routing)
		# ──────────────────────────────────────────────
		location ~* \.html$ {
			expires -1;
			add_header Cache-Control "no-cache" always;
			add_header X-Content-Type-Options "nosniff" always;
			add_header Referrer-Policy "strict-origin-when-cross-origin" always;
			add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
			add_header X-Frame-Options "DENY" always;
			add_header Content-Security-Policy-Report-Only "default-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; script-src 'strict-dynamic' 'nonce-$http_csp_nonce' 'unsafe-inline' https: http:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; form-action 'self'; report-uri /api/csp-report" always;
			proxy_pass http://barghsa_web;
			proxy_set_header Host               $host;
			proxy_set_header X-Real-IP          $remote_addr;
			proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto  $scheme;
		}

		# ──────────────────────────────────────────────
		# Deny access to hidden files
		# ──────────────────────────────────────────────
		location ~ /\. {
			deny all;
			access_log off;
			log_not_found off;
		}
	}
}