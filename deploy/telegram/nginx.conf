# Render both placeholders from protected configuration; install with mode 0600.
# This host carries Telegram traffic only. Application state stays on staging.
limit_req_zone $binary_remote_addr zone=barghsa_telegram_webhook:1m rate=5r/s;
log_format barghsa_telegram_health '$status $upstream_addr $upstream_status '
    '$request_time $upstream_connect_time $upstream_header_time $upstream_response_time';

server {
    listen 80;
    listen [::]:80;
    server_name eu.barghsa.com;
    access_log off;
    error_log /dev/null;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/barghsa-acme;
    }
    location / { return 404; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name eu.barghsa.com;
    ssl_certificate /etc/letsencrypt/live/eu.barghsa.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eu.barghsa.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    # Bot tokens appear in Bot API paths. Never log paths, payloads or secrets.
    access_log /var/log/nginx/barghsa-telegram-health.log barghsa_telegram_health;
    error_log /dev/null;
    client_max_body_size 64k;
    client_body_timeout 10s;
    add_header Cache-Control "private, no-store" always;
    proxy_cache off;
    proxy_next_upstream off;
    proxy_connect_timeout 5s;
    proxy_send_timeout 5s;
    proxy_read_timeout 9s;
    proxy_pass_request_headers off;
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

    location ~ "^/telegram-api/bot__BOT_TOKEN__/(getMe|sendMessage)$" {
        allow 89.42.199.13;
        deny all;
        if ($request_method != POST) { return 405; }
        if ($args != "") { return 400; }
        rewrite ^/telegram-api/(.*)$ /$1 break;
        proxy_set_header Content-Type application/json;
        proxy_set_header Host api.telegram.org;
        proxy_ssl_name api.telegram.org;
        proxy_pass https://api.telegram.org;
    }

    location = /api/telegram/webhook {
        if ($request_method != POST) { return 405; }
        if ($args != "") { return 400; }
        if ($http_x_telegram_bot_api_secret_token != "__WEBHOOK_SECRET__") { return 401; }
        limit_req zone=barghsa_telegram_webhook burst=20 nodelay;
        limit_req_status 429;
        proxy_set_header Content-Type application/json;
        proxy_set_header Host stg.barghsa.com;
        proxy_set_header X-Telegram-Bot-Api-Secret-Token "__WEBHOOK_SECRET__";
        proxy_ssl_name stg.barghsa.com;
        proxy_pass https://stg.barghsa.com;
    }

    location / { return 404; }
}
