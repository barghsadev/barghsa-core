# Barghsa single-VM pilot
#
# Merge with docker-compose.yml on an isolated pilot host.
# See docs/deployment.md for protected inputs and startup order.

name: barghsa-prod

x-release-logging: &release-logging
  driver: json-file
  options:
    labels: org.opencontainers.image.revision

services:
  postgres:
    extends:
      file: docker-compose.backup.yml
      service: postgres
    ports: !reset []
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, barghsa]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set the pilot database password}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:?Set the off-host HTTPS backup endpoint}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:?Set the private off-host backup bucket}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-us-east-1}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:?Set the backup storage access key}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:?Set the backup storage secret key}
      BACKUP_S3_SESSION_TOKEN: ${BACKUP_S3_SESSION_TOKEN:-}
      BACKUP_ALLOW_HTTP: 'false'

  # Production API/worker depend on this service. Keep the pooling profile
  # optional in development, but enable the service in this production overlay.
  pgbouncer:
    profiles: !reset []
    ports: !reset []
    environment:
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD:?Set the pilot database password}

  redis:
    profiles: [cache]
    ports: !reset []

  minio:
    ports: !override ['127.0.0.1:9000:9000', '127.0.0.1:9001:9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Set the pilot storage access key}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Set the pilot storage secret key}

  minio-init:
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Set the pilot storage access key}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set the pilot storage secret key}

  # Private ClamAV daemon for confirmed business documents. No host port is
  # published; only services on the Compose network can reach TCP 3310.
  clamav:
    build:
      context: .
      dockerfile: deploy/clamav/Dockerfile
    volumes:
      - clamav-db:/var/lib/clamav
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────
  # API Server (NestJS)
  # ─────────────────────────────────────────────────────────────
  api:
    env_file:
      - ${BARGHSA_RUNTIME_ENV_FILE:?Set the external runtime configuration file}
    build: &app-build
      context: .
      dockerfile: Dockerfile.base
      target: production
      args: &release-build-args
        BARGHSA_RELEASE_SHA: ${BARGHSA_RELEASE_SHA:-}
    logging: *release-logging
    ports:
      - '127.0.0.1:4000:4000'
    environment:
      NODE_ENV: production
      BARGHSA_DEPLOYMENT_ENV: production
      NODE_OPTIONS: '--max-old-space-size=512 --no-deprecation'
      DATABASE_URL: ${DATABASE_URL:?Set the application database URL}
      REDIS_URL: ${REDIS_URL:-}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?Set the public application URL}
      API_PUBLIC_URL: ${API_PUBLIC_URL:?Set the public API URL for payment callbacks}
      PAYMENT_GATEWAY_MERCHANT_ID: ${PAYMENT_GATEWAY_MERCHANT_ID:?Set the payment merchant ID}
      AUTH_DELIVERY_ENCRYPTION_KEY: ${AUTH_DELIVERY_ENCRYPTION_KEY:?Set the auth delivery encryption key}
      AI_INFERENCE_URL: http://ai-inference:9091
      DOCUMENT_CLAMAV_HOST: clamav
      DOCUMENT_CLAMAV_PORT: 3310
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      clamav:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', 'healthcheck-runtime.cjs']
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 40s
    tmpfs:
      - /tmp:size=64m,mode=1777
    # Security hardening
    cap_drop:
      - ALL
    read_only: true
    security_opt:
      - no-new-privileges:true

  # ─────────────────────────────────────────────────────────────
  # Web Frontend (Vite SPA)
  # ─────────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args: *release-build-args
    logging: *release-logging
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      NODE_ENV: production
      BARGHSA_DEPLOYMENT_ENV: production
      NODE_OPTIONS: '--max-old-space-size=512 --no-deprecation'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', 'healthcheck.js']
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 40s
    tmpfs:
      - /tmp:size=64m,mode=1777
    # Security hardening
    cap_drop:
      - ALL
    read_only: true
    security_opt:
      - no-new-privileges:true

  worker:
    env_file:
      - ${BARGHSA_RUNTIME_ENV_FILE:?Set the external runtime configuration file}
    build: *app-build
    logging: *release-logging
    command: ['node', 'worker/dist/main.js']
    environment:
      NODE_ENV: production
      NODE_OPTIONS: '--max-old-space-size=512 --no-deprecation'
      DATABASE_URL: ${DATABASE_URL:?Set the application database URL}
      AUTH_DELIVERY_ENCRYPTION_KEY: ${AUTH_DELIVERY_ENCRYPTION_KEY:?Set the auth delivery encryption key}
      DOCUMENT_CLAMAV_HOST: clamav
      DOCUMENT_CLAMAV_PORT: 3310
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      clamav:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 40s
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    read_only: true
    security_opt:
      - no-new-privileges:true

  ai-inference:
    env_file:
      - ${BARGHSA_RUNTIME_ENV_FILE:?Set the external runtime configuration file}
    build: *app-build
    logging: *release-logging
    command: ['node', 'worker/dist/ai-inference/main.js']
    environment:
      NODE_ENV: production
      NODE_OPTIONS: '--max-old-space-size=512 --no-deprecation'
      DATABASE_URL: ${DATABASE_URL:?Set the application database URL}
      AI_INFERENCE_HOST: 0.0.0.0
      AI_INFERENCE_PORT: 9091
      WORKER_PORT: 9091
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', 'worker/healthcheck.js']
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 40s
    cap_drop:
      - ALL
    read_only: true
    security_opt:
      - no-new-privileges:true

secrets:
  postgres_backup_key:
    file: ${BACKUP_GPG_PASSPHRASE_FILE:?Provide the pilot backup key file outside the checkout}

volumes:
  clamav-db:
