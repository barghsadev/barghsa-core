name: CI
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    # Create a preflight branch directly at the immutable candidate SHA.
    branches: [main, 'codex/preflight/**']
  workflow_dispatch:

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10.11.1'
  # Manual release checks always run the full suite. Ordinary pushes and PRs can use affected tests.
  FULL_CI: ${{ github.event_name == 'workflow_dispatch' || vars.CI_FULL_CHECKS == 'true' || (github.event_name == 'pull_request' && vars.CI_FULL_PR_CHECKS == 'true') }}
  ENFORCE_RELEASE_LICENSES: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sast:
    name: Static security checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SEMGREP_SEND_METRICS: 'off'
      SEMGREP_ENABLE_VERSION_CHECK: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install static scanner
        run: python -m pip install semgrep==1.176.1
      - name: Verify static scan report handling
        run: python -m unittest discover -s scripts -p 'test_check_sast.py'
      - name: Verify rules and scan application source
        run: python scripts/check-sast.py --report "$RUNNER_TEMP/static-security.json"
      - name: Upload static scan locations without source snippets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-security
          path: ${{ runner.temp }}/static-security.json
          retention-days: 14

  secrets:
    name: Scan Git history for secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify secret scan failure handling
        run: python3 -m unittest discover -s scripts -p 'test_check_secrets.py'
      - name: Verify scanner and scan complete history
        run: python3 scripts/check-secrets.py --report "$RUNNER_TEMP/secret-scan.json"
      - name: Upload redacted secret scan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan
          path: ${{ runner.temp }}/secret-scan.json
          retention-days: 14

  images:
    name: Scan runtime container images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build the four staging runtime images
        run: |
          docker build -f Dockerfile.base --target production --build-arg "BARGHSA_RELEASE_SHA=$GITHUB_SHA" -t "barghsa-ci-app:$GITHUB_SHA" .
          docker build -f Dockerfile.web --target production --build-arg "BARGHSA_RELEASE_SHA=$GITHUB_SHA" -t "barghsa-ci-web:$GITHUB_SHA" .
          docker build -f deploy/clamav/Dockerfile -t "barghsa-ci-clamav:$GITHUB_SHA" .
          docker build -f packages/db/scripts/backup/Dockerfile -t "barghsa-ci-postgres:$GITHUB_SHA" .
      - name: Scan exact built image IDs
        run: |
          bash scripts/check-runtime-images.sh "$RUNNER_TEMP/runtime-image-scan" \
            "barghsa-ci-app:$GITHUB_SHA" "barghsa-ci-web:$GITHUB_SHA" \
            "barghsa-ci-clamav:$GITHUB_SHA" "barghsa-ci-postgres:$GITHUB_SHA"
      - name: Verify release license policy handling
        run: python3 -m unittest discover -s scripts -p 'test_check_release_licenses.py'
      - name: Check shipped component licenses
        run: |
          args=()
          if [ "$ENFORCE_RELEASE_LICENSES" != true ]; then args+=(--report-only); fi
          python3 scripts/check-release-licenses.py "$RUNNER_TEMP/runtime-image-scan" "$GITHUB_SHA" \
            --report "$RUNNER_TEMP/runtime-image-scan/release-licenses.json" "${args[@]}"
      - name: Upload runtime image vulnerability reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-image-vulnerability-reports
          path: ${{ runner.temp }}/runtime-image-scan
          if-no-files-found: warn
          retention-days: 14

  quality:
    name: Check build and application integrity
    # Keep the browser dependency install on a fixed Ubuntu release.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Validate current task and release board
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            python3 kanban/scripts/board.py check --pull-request-event "$GITHUB_EVENT_PATH"
          else
            python3 kanban/scripts/board.py check
          fi
      - name: Verify task inventory and acceptance safety
        run: python3 -m unittest discover -s kanban/scripts -p 'test_*.py'
      - run: pnpm install --frozen-lockfile
      - name: Verify development watcher compatibility
        run: node --test scripts/nodemon-watch.test.mjs
      - name: Scan dependencies for high and critical advisories
        run: |
          pnpm audit --audit-level=high --json > "$RUNNER_TEMP/dependency-audit.json" || true
          node scripts/check-dependency-audit.mjs "$RUNNER_TEMP/dependency-audit.json"
      - name: Upload dependency scan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: ${{ runner.temp }}/dependency-audit.json
          retention-days: 14
      - run: pnpm build
      - name: Verify security headers on the production web build
        run: node scripts/check-production-security-headers.mjs
        env:
          WEB_CSP_MODE: report-only
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm lint
      - name: Verify shared lint rules
        run: node --test packages/eslint-config/*.test.mjs
      - run: pnpm check:suppressed-errors
      - name: Enforce production route budgets
        run: pnpm check:bundle
      - name: Validate pilot TLS proxy and edge quotas
        run: python3 scripts/test-pilot-proxy.py
      - name: Validate staging proxy security headers and edge quotas
        run: python3 scripts/test-pilot-proxy.py --profile staging
      - run: pnpm check:contract
      - run: pnpm check:db-snapshot
      - name: Install production browser check runtime
        run: |
          bash scripts/configure-ci-ubuntu-mirrors.sh
          pnpm --filter @barghsa/web exec playwright install --with-deps chromium
      - name: Enforce primary mobile page performance
        run: |
          node scripts/run-production-browser.mjs \
            e2e/login-ui.spec.ts e2e/customer-service-history-views.spec.ts \
            --project=mobile-chrome --workers=1 --reporter=list,json
        env:
          BARGHSA_TEST_PREBUILT: '1'
          BARGHSA_PRIMARY_MOBILE_PERF: '1'
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/primary-mobile-performance.json
      - name: Upload primary mobile measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: primary-mobile-performance
          path: ${{ runner.temp }}/primary-mobile-performance.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Enforce critical page accessibility
        if: env.FULL_CI != 'true'
        run: |
          node scripts/run-production-browser.mjs \
            e2e/login-ui.spec.ts \
            e2e/dashboard-widget-loading.spec.ts \
            e2e/customer-service-history-views.spec.ts \
            e2e/wallet-receipt-timeline.spec.ts \
            e2e/contract-quantity-increase.spec.ts \
            --grep @a11y-critical
        env:
          BARGHSA_TEST_PREBUILT: '1'
      - name: Report non-critical page accessibility advisories
        if: env.FULL_CI != 'true'
        run: |
          node scripts/run-production-browser.mjs \
            e2e/workspace-media-routes.spec.ts \
            e2e/failed-notifications.spec.ts \
            --reporter=list,json
        env:
          BARGHSA_TEST_PREBUILT: '1'
          BARGHSA_A11Y_ADVISORY: '1'
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/accessibility-advisories.json
      - name: Upload non-critical accessibility advisories
        if: always() && env.FULL_CI != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-advisories
          path: ${{ runner.temp }}/accessibility-advisories.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify actual cold authentication transfers
        if: env.FULL_CI == 'true'
        run: node scripts/check-auth-transfer.mjs
      - name: Verify browser retry failure gate
        if: env.FULL_CI == 'true'
        run: node --test scripts/test-browser-flake-gate.mjs scripts/browser-projects.test.mjs

      - name: Test process coverage merging
        if: env.FULL_CI == 'true'
        run: node --test scripts/align-process-coverage.test.mjs
      - name: Build isolated browser coverage assets
        if: env.FULL_CI == 'true'
        run: pnpm --filter @barghsa/web build
        env:
          BARGHSA_BROWSER_COVERAGE: '1'
      - name: Build component stories for Playwright
        if: env.FULL_CI == 'true'
        run: pnpm --filter @barghsa/ui stories:build
      - name: Verify clean checkout before browser coverage
        if: env.FULL_CI == 'true'
        run: |
          changed=$(git status --porcelain)
          if [ -n "$changed" ]; then
            echo "$changed"
            echo "::error::Browser coverage requires a clean source checkout"
            exit 1
          fi
      - name: Exercise all production browser flows and shared components
        if: env.FULL_CI == 'true'
        run: node scripts/run-production-browser.mjs
        env:
          BARGHSA_BROWSER_COVERAGE: '1'
          BARGHSA_A11Y_ADVISORY: '1'
      - name: Map browser coverage to workspace source
        if: always() && env.FULL_CI == 'true'
        run: node scripts/collect-browser-coverage.mjs
      - name: Upload mapped browser coverage
        if: always() && env.FULL_CI == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: browser-source-coverage
          path: apps/web/test-results/browser-coverage.json
          retention-days: 14
      - name: Report observed browser flakes and failures
        if: always() && env.FULL_CI == 'true'
        run: |
          python3 -m unittest discover -s scripts -p 'test_check_browser_results.py'
          python3 scripts/check-browser-results.py --input apps/web/test-results/results.json --report "$RUNNER_TEMP/browser-outcomes.json"
      - name: Upload browser outcome counts
        if: always() && env.FULL_CI == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: browser-outcomes
          path: ${{ runner.temp }}/browser-outcomes.json
          retention-days: 14
      - name: Upload production browser failures
        if: failure() && env.FULL_CI == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: production-browser-failures
          path: apps/web/test-results/
          retention-days: 7

  integrity:
    name: Verify monorepo integrity
    needs: [sast, secrets, images, quality, test]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require successful application and security checks
        env:
          SAST_RESULT: ${{ needs.sast.result }}
          SECRET_SCAN_RESULT: ${{ needs.secrets.result }}
          IMAGE_SCAN_RESULT: ${{ needs.images.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          if [ "$FULL_CI" = true ]; then
            test_mode=full
          else
            test_mode=affected
          fi
          if [ "$ENFORCE_RELEASE_LICENSES" = true ]; then
            license_mode=enforced
          else
            license_mode=report-only
          fi
          {
            printf '### Monorepo integrity for %s\n\n' "$GITHUB_SHA"
            printf 'Test mode **%s**. Image license policy **%s**.\n\n' "$test_mode" "$license_mode"
            printf '| Required job | Result |\n| --- | --- |\n'
            printf '| Static security | %s |\n' "$SAST_RESULT"
            printf '| Secret scan | %s |\n' "$SECRET_SCAN_RESULT"
            printf '| Runtime images | %s |\n' "$IMAGE_SCAN_RESULT"
            printf '| Build and application integrity | %s |\n' "$QUALITY_RESULT"
            printf '| Tests | %s |\n' "$TEST_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"
          test "$SAST_RESULT" = success
          test "$SECRET_SCAN_RESULT" = success
          test "$IMAGE_SCAN_RESULT" = success
          test "$QUALITY_RESULT" = success
          test "$TEST_RESULT" = success

  test:
    name: Run tests
    # Keep the Poppler dependency install on a fixed Ubuntu release.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install PDF preview renderer
        timeout-minutes: 6
        run: bash scripts/install-ci-pdf-renderer.sh
      - run: pnpm build
      # Every workspace coverage script runs the same test suite with coverage enabled.
      # Run it once, with at most two packages starting database/server fixtures together.
      - name: Run affected tests or full coverage
        id: coverage
        env:
          BARGHSA_TEST_PREBUILT: '1'
          BARGHSA_TEST_POSTGRES_COMPOSE: '1'
          PUSH_TEST_BASE: ${{ github.event.before }}
        run: |
          if [ "$FULL_CI" != "true" ]; then
            if [ "${{ github.event_name }}" = "push" ]; then
              filters=()
              if [ "${{ github.event.created }}" = "true" ] && [[ "$GITHUB_REF" == refs/heads/codex/preflight/* ]]; then
                PUSH_TEST_BASE=$(git merge-base HEAD origin/main 2>/dev/null) || PUSH_TEST_BASE=''
              fi
              if git cat-file -e "$PUSH_TEST_BASE^{commit}" 2>/dev/null; then
                filters+=(--filter="...[$PUSH_TEST_BASE]")
              fi
              pnpm turbo run test --force --concurrency=2 "${filters[@]}"
            else
              pnpm turbo run test --force --concurrency=2 --filter="...[origin/main]"
            fi
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm turbo run test:coverage --concurrency=2 --filter="...[origin/main]" --filter=@barghsa/web --filter=@barghsa/ui --filter=@barghsa/shared --filter=@barghsa/i18n
          else
            pnpm test:coverage --concurrency=2
          fi
      - name: Upload coverage reports
        if: always() && env.FULL_CI == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            apps/*/coverage/
            packages/*/coverage/
          retention-days: 14
      - name: Report flaky test count
        if: always()
        id: flaky-check
        env:
          ENFORCE_PROMOTION_QUARANTINE: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          python3 -m unittest discover -s scripts -p 'test_check_flaky_tests.py'
          args=()
          if [ "$ENFORCE_PROMOTION_QUARANTINE" = true ]; then args+=(--promotion); fi
          ./scripts/check-flaky-tests.sh --report "$RUNNER_TEMP/flaky-test-report.json" "${args[@]}"
      - name: Upload flaky test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flaky-test-report
          path: ${{ runner.temp }}/flaky-test-report.json
          retention-days: 7

  coverage:
    name: Verify combined source coverage
    needs: [test, integrity]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report temporary fast-mode coverage exemption
        if: env.FULL_CI != 'true'
        env:
          TEST_RESULT: ${{ needs.test.result }}
          INTEGRITY_RESULT: ${{ needs.integrity.result }}
        run: |
          echo "Fast mode runs critical accessibility, affected tests and integrity checks. Dispatch CI for a full release check or set CI_FULL_CHECKS=true for pushes." >> "$GITHUB_STEP_SUMMARY"
          test "$TEST_RESULT" = success
          test "$INTEGRITY_RESULT" = success
      - uses: actions/checkout@v4
        if: env.FULL_CI == 'true'
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        if: env.FULL_CI == 'true'
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        if: env.FULL_CI == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: env.FULL_CI == 'true'
      - uses: actions/download-artifact@v4
        if: env.FULL_CI == 'true'
        with:
          name: coverage-reports
          path: .
      - uses: actions/download-artifact@v4
        if: env.FULL_CI == 'true'
        with:
          name: browser-source-coverage
          path: ${{ runner.temp }}/browser-source
      - name: Verify coverage collection and failure handling
        if: env.FULL_CI == 'true'
        run: |
          python3 -m unittest discover -s scripts -p 'test_check_changed_coverage.py'
          node --test scripts/browser-coverage.test.mjs
      - name: Merge browser and unit coverage for the same revision
        if: env.FULL_CI == 'true'
        run: node scripts/merge-browser-coverage.mjs "$RUNNER_TEMP/browser-source/browser-coverage.json"
      - name: Enforce changed source and critical file coverage
        if: env.FULL_CI == 'true'
        env:
          COVERAGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            COVERAGE_BASE=$(python3 - <<'PY'
          import json

          with open('kanban/board.json') as ledger:
              releases = json.load(ledger)['releases']
          previous = next(release for release in reversed(releases) if release['status'] == 'released')
          print(previous['published_commit'])
          PY
            )
          fi
          python3 scripts/check-changed-coverage.py --base "$COVERAGE_BASE" --report "$RUNNER_TEMP/changed-coverage.json"
      - name: Upload changed coverage results
        if: always() && env.FULL_CI == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: changed-coverage
          path: ${{ runner.temp }}/changed-coverage.json
          retention-days: 14
