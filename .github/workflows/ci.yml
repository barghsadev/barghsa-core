name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10.8.1'

jobs:
  integrity:
    name: Verify monorepo integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Validate canonical task queue
        run: python3 kanban/scripts/build_backlog.py --check
      - name: Verify loop state and dispatch protocol
        run: python3 -m unittest discover -s kanban/scripts -p 'test_*.py'
      - run: pnpm install --frozen-lockfile
      - name: Scan dependencies for high and critical advisories
        run: pnpm audit --audit-level=high --json > "$RUNNER_TEMP/dependency-audit.json"
      - name: Upload dependency scan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: ${{ runner.temp }}/dependency-audit.json
          retention-days: 14
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm check:suppressed-errors
      - run: pnpm check:bundle
      - name: Validate pilot TLS proxy and edge quotas
        run: python3 scripts/test-pilot-proxy.py
      - run: pnpm check:contract
      - name: Install production browser check runtime
        run: pnpm --filter @barghsa/web exec playwright install --with-deps chromium
      - name: Verify actual cold authentication transfers
        run: node scripts/check-auth-transfer.mjs
      - name: Exercise all production browser flows and shared components
        run: node scripts/run-production-browser.mjs
      - name: Upload production browser failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-browser-failures
          path: apps/web/test-results/
          retention-days: 7

  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Run tests (affected on PR, full on main)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm turbo run test --filter="...[origin/main]"
          else
            pnpm test
          fi
      - name: Run coverage with threshold enforcement
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm turbo run test:coverage --filter="...[origin/main]"
          else
            pnpm test:coverage
          fi
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: coverage/
          retention-days: 14
      - name: Report flaky test count
        id: flaky-check
        run: ./scripts/check-flaky-tests.sh
      - name: Upload flaky test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flaky-test-report
          path: scripts/quarantine-registry.json
          retention-days: 7
