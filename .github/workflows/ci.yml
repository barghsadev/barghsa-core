name: CI
on:
  push:
    branches: ['codex/preflight/v0.6-runtime-smoke-diagnostic']

jobs:
  images:
    name: Scan runtime container images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build the four staging runtime images
        run: |
          docker build -f Dockerfile.base --target production -t "barghsa-ci-app:$GITHUB_SHA" .
          docker build -f Dockerfile.web --target production --build-arg "BARGHSA_RELEASE_SHA=$GITHUB_SHA" -t "barghsa-ci-web:$GITHUB_SHA" .
          docker build -f deploy/clamav/Dockerfile -t "barghsa-ci-clamav:$GITHUB_SHA" .
          docker build -f packages/db/scripts/backup/Dockerfile -t "barghsa-ci-postgres:$GITHUB_SHA" .
      - name: Exercise app, web and worker in a disposable network
        shell: bash
        run: |
          BARGHSA_TEST_APP_IMAGE="barghsa-ci-app:$GITHUB_SHA" \
            BARGHSA_TEST_WEB_IMAGE="barghsa-ci-web:$GITHUB_SHA" \
            BARGHSA_TEST_POSTGRES_IMAGE="barghsa-ci-postgres:$GITHUB_SHA" \
            python3 scripts/test-container-packaging.py
