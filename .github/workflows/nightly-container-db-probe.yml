name: Verify the corrected nightly browser fixture
on:
  push:
    branches: ['codex/verify/v06-nightly-fixture-fix-20261120']
permissions:
  contents: read
jobs:
  browser-build:
    name: Build the production browser fixtures once
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      archive_sha256: ${{ steps.package.outputs.archive_sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10.11.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Build component stories for Playwright
        run: pnpm --filter @barghsa/ui stories:build
      - name: Package the compiled fixtures
        id: package
        shell: bash
        run: |
          printf '%s\n' "$GITHUB_SHA" > .nightly-browser-revision
          archive="$RUNNER_TEMP/nightly-browser-build.tar.gz"
          tar -czf "$archive" .nightly-browser-revision apps/*/dist packages/*/dist packages/ui/story-build
          digest=$(sha256sum "$archive")
          printf 'archive_sha256=%s\n' "${digest%% *}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: nightly-browser-build-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nightly-browser-build.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  browser-fixture:
    needs: browser-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-resolute@sha256:916c9fb63a8340822589dd5c821dae82e8012106bb8515a72f278d97f277446a
      options: --shm-size=1g
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10.11.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.browser-build.outputs.artifact_id }}
          path: ${{ runner.temp }}/nightly-browser-build
          merge-multiple: true
      - name: Verify and restore the compiled fixtures
        shell: bash
        env:
          BROWSER_ARCHIVE_SHA256: ${{ needs.browser-build.outputs.archive_sha256 }}
        run: |
          [[ "$BROWSER_ARCHIVE_SHA256" =~ ^[a-f0-9]{64}$ ]]
          archive="$RUNNER_TEMP/nightly-browser-build/nightly-browser-build.tar.gz"
          printf '%s  %s\n' "$BROWSER_ARCHIVE_SHA256" "$archive" | sha256sum -c
          test "$(tar -xOzf "$archive" .nightly-browser-revision)" = "$GITHUB_SHA"
          tar -xzf "$archive" --exclude=.nightly-browser-revision
      - name: Install pinned Firefox runtime
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/barghsa-firefox
        run: |
          # Firefox 1572 crashes during axe analysis. Revision 1575 passes the same cases.
          pnpm dlx playwright@1.66.0-alpha-2026-11-10 install firefox
          firefox="$PLAYWRIGHT_BROWSERS_PATH/firefox-1575/firefox/firefox"
          test -x "$firefox"
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s\nBARGHSA_FIREFOX_EXECUTABLE=%s\n' "$PLAYWRIGHT_BROWSERS_PATH" "$firefox" >> "$GITHUB_ENV"
      - name: Verify browser selection and result handling
        run: |
          node --test scripts/browser-projects.test.mjs
          python3 -m unittest discover -s scripts -p 'test_check_browser_results.py'
      - name: Exercise authenticated staff cases as the designated browser user
        env:
          BARGHSA_TEST_PREBUILT: '1'
          WEB_CSP_MODE: enforce
        run: |
          chown pwuser:pwuser apps/web
          docker_group=$(stat -c '%g' /var/run/docker.sock)
          setpriv --reuid=pwuser --regid=pwuser --groups "$docker_group" id
          setpriv --reuid=pwuser --regid=pwuser --groups "$docker_group" \
            node scripts/run-production-browser.mjs admin-settings-live.spec.ts \
              --project=firefox --grep 'favicon upload stays private|contract limits save and reload'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-browser-fixture-results
          path: apps/web/test-results/
          retention-days: 1
