name: Verify the nightly browser fixture through runner loopback
on:
  push:
    branches: ['codex/verify/v06-nightly-loopback-fixture-20261120']
permissions:
  actions: read
  contents: read
jobs:
  browser-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10.11.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: 14670462547
          run-id: 44818319239
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/nightly-browser-build
          merge-multiple: true
      - name: Verify and restore the compiled fixtures
        shell: bash
        env:
          BROWSER_ARCHIVE_SHA256: '8d468357a90487fd832790f57ed20e44aa3b4d4495e014a5250ad337ac445fad'
        run: |
          [[ "$BROWSER_ARCHIVE_SHA256" =~ ^[a-f0-9]{64}$ ]]
          archive="$RUNNER_TEMP/nightly-browser-build/nightly-browser-build.tar.gz"
          printf '%s  %s\n' "$BROWSER_ARCHIVE_SHA256" "$archive" | sha256sum -c
          test "$(tar -xOzf "$archive" .nightly-browser-revision)" = "c1a670e1ff91d5b2ee48994b24e000fb181d492c"
          tar -xzf "$archive" --exclude=.nightly-browser-revision
      - name: Install pinned Firefox runtime
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/barghsa-firefox
        run: |
          # Firefox 1572 crashes during axe analysis. Revision 1575 passes the same cases.
          pnpm dlx playwright@1.66.0-alpha-2026-11-10 install firefox
          firefox="$PLAYWRIGHT_BROWSERS_PATH/firefox-1575/firefox/firefox"
          test -x "$firefox"
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s\nBARGHSA_FIREFOX_EXECUTABLE=%s\n' "$PLAYWRIGHT_BROWSERS_PATH" "$firefox" >> "$GITHUB_ENV"
      - name: Verify browser selection and result handling
        run: |
          node --test scripts/browser-projects.test.mjs
          python3 -m unittest discover -s scripts -p 'test_check_browser_results.py'
      - name: Exercise the native database fixture with host loopback
        env:
          BARGHSA_TEST_PREBUILT: '1'
          WEB_CSP_MODE: enforce
        run: |
          docker run --rm --network host --shm-size=1g \
            --user "$(id -u):$(id -g)" --group-add "$(stat -c '%g' /var/run/docker.sock)" \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            --volume "$RUNNER_TEMP:$RUNNER_TEMP" \
            --volume "$RUNNER_TOOL_CACHE:$RUNNER_TOOL_CACHE:ro" \
            --workdir "$GITHUB_WORKSPACE" \
            --env PATH --env CI --env BARGHSA_TEST_PREBUILT --env BARGHSA_FIREFOX_EXECUTABLE \
            --env "PLAYWRIGHT_BROWSERS_PATH=${PLAYWRIGHT_BROWSERS_PATH:-/ms-playwright}" \
            --env TESTCONTAINERS_HOST_OVERRIDE=127.0.0.1 \
            --env WEB_CSP_MODE \
            mcr.microsoft.com/playwright:v1.65.0-resolute@sha256:916c9fb63a8340822589dd5c821dae82e8012106bb8515a72f278d97f277446a \
            node scripts/run-production-browser.mjs admin-settings-live.spec.ts \
              --project=firefox --grep 'favicon upload stays private|contract limits save and reload'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-loopback-fixture-results
          path: apps/web/test-results/
          retention-days: 1
