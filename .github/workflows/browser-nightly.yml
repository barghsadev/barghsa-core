name: Nightly browser checks
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contracts:
    name: Dependency advisories, migration drift and navigation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10.11.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        id: install
      - name: Fetch and check dependency advisories
        run: |
          pnpm audit --audit-level=high --json > "$RUNNER_TEMP/dependency-audit.json" || true
          node scripts/check-dependency-audit.mjs "$RUNNER_TEMP/dependency-audit.json"
      - name: Verify Drizzle generation has no migration drift
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          pnpm --filter @barghsa/db run db:generate | tee "$RUNNER_TEMP/drizzle-generate.log"
          grep -Fq 'No schema changes, nothing to migrate' "$RUNNER_TEMP/drizzle-generate.log"
          changes=$(git status --porcelain --untracked-files=all -- packages/db/drizzle/production)
          if [[ -n "$changes" ]]; then
            printf '%s\n' "$changes" >&2
            exit 1
          fi
      - name: Verify registered navigation destinations
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm exec turbo run typecheck --filter=@barghsa/web
      - name: Upload nightly dependency and migration results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-dependencies-and-migrations
          path: |
            ${{ runner.temp }}/dependency-audit.json
            ${{ runner.temp }}/drizzle-generate.log
          retention-days: 14

  browsers:
    name: Supply one controlled browser receipt
    runs-on: ubuntu-latest
    steps:
      - name: Write one valid shard receipt
        run: |
          printf '%s\n' '{"schema_version":1,"status":"passed","expected":1,"unexpected":0,"flaky":0,"skipped":0,"runner_errors":0}' > "$RUNNER_TEMP/browser-outcomes.json"
      - uses: actions/upload-artifact@v4
        with:
          name: browser-outcome-chromium-1
          path: ${{ runner.temp }}/browser-outcomes.json

  report:
    name: Report seven days of browser outcomes
    if: ${{ always() && !cancelled() }}
    needs: [browsers]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: browser-outcome-*
          path: ${{ runner.temp }}/browser-outcomes
      - name: Read recent scheduled outcomes
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          history="$RUNNER_TEMP/nightly-history"
          mkdir -p "$history"
          since=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)
          gh run list --repo "$GITHUB_REPOSITORY" --workflow browser-nightly.yml \
            --branch "$DEFAULT_BRANCH" --event schedule --status completed --created ">=$since" \
            --limit 30 --json databaseId,conclusion > "$history/runs.json"
          while IFS= read -r run; do
            if ! gh run download "$run" --repo "$GITHUB_REPOSITORY" \
              --name nightly-browser-summary --dir "$history/$run"; then
              echo "No outcome receipt available for scheduled run $run."
            fi
          done < <(jq -r '.[].databaseId' "$history/runs.json")
      - name: Summarize current and historical outcomes
        if: ${{ always() && !cancelled() }}
        run: |
          python3 -m unittest discover -s scripts -p 'test_report_nightly_browser.py'
          python3 scripts/report-nightly-browser.py \
            --outcomes "$RUNNER_TEMP/browser-outcomes" --history "$RUNNER_TEMP/nightly-history" \
            --report "$RUNNER_TEMP/nightly-browser-summary.json"
      - name: Check known quarantines
        if: ${{ always() && !cancelled() }}
        run: python3 scripts/check-flaky-tests.py --report "$RUNNER_TEMP/nightly-quarantine.json"
      - name: Upload nightly rollup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-browser-summary
          path: |
            ${{ runner.temp }}/nightly-browser-summary.json
            ${{ runner.temp }}/nightly-quarantine.json
          overwrite: true
          retention-days: 14
