name: Nightly browser checks
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  browsers:
    name: Production browser / ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, mobile-safari]
        include:
          - { project: chromium, browser: chromium }
          - { project: mobile-safari, browser: webkit }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10.11.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Build component stories for Playwright
        run: pnpm --filter @barghsa/ui stories:build
      - name: Install browser runtimes
        run: pnpm --filter @barghsa/web exec playwright install --with-deps "${{ matrix.browser }}"
      - name: Verify browser selection and result handling
        run: |
          node --test scripts/browser-projects.test.mjs
          python3 -m unittest discover -s scripts -p 'test_check_browser_results.py'
      - name: Exercise the production app in the selected browser
        shell: bash
        run: |
          if [[ "$BROWSER_PROJECT" == chromium ]]; then
            node scripts/run-production-browser.mjs e2e/reconciliation-forms.spec.ts --project "$BROWSER_PROJECT" --retries=0 --grep "reconciliation validates native fields.*[(]fa[)]"
          else
            node scripts/run-production-browser.mjs e2e/delivery-provider-tables.spec.ts e2e/documents.spec.ts e2e/geography-tables.spec.ts e2e/gift-code-tables.spec.ts e2e/operational-queue-tables.spec.ts e2e/reconciliation-tables.spec.ts e2e/sms-provider-settings.spec.ts e2e/staff-directory-tables.spec.ts e2e/template-catalogue-tables.spec.ts --project "$BROWSER_PROJECT" --retries=0 --grep "fa: staff review keeps|cards share recipient.*[(]fa[)]|SMS cards preserve mappings.*[(]fa[)]|geography cards keep.*[(]fa[)]|gift-code tables preserve.*[(]fa[)]|cards share details.*[(]fa[)]|reconciliation cards.*[(]fa[)]|SMS variable suggestions|staff cards.*[(]fa[)]|role cards.*[(]fa[)]|template tables retain.*[(]fa[)]"
          fi
        env:
          BROWSER_PROJECT: ${{ matrix.project }}
          BARGHSA_TEST_PREBUILT: '1'
      - name: Report observed browser outcomes
        if: always()
        run: python3 scripts/check-browser-results.py --input apps/web/test-results/results.json --report "${{ runner.temp }}/browser-outcomes.json"
      - name: Check known quarantines
        if: always()
        run: python3 scripts/check-flaky-tests.py --report "${{ runner.temp }}/quarantine.json"
      - name: Upload outcomes and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-${{ matrix.project }}
          path: |
            ${{ runner.temp }}/browser-outcomes.json
            ${{ runner.temp }}/quarantine.json
            apps/web/test-results/
          retention-days: 14
