name: Nightly browser checks
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contracts:
    name: Dependency advisories and migration drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10.11.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        id: install
      - name: Fetch and check dependency advisories
        run: |
          pnpm audit --audit-level=high --json > "$RUNNER_TEMP/dependency-audit.json" || true
          node scripts/check-dependency-audit.mjs "$RUNNER_TEMP/dependency-audit.json"
      - name: Verify Drizzle generation has no migration drift
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          pnpm --filter @barghsa/db run db:generate | tee "$RUNNER_TEMP/drizzle-generate.log"
          grep -Fq 'No schema changes, nothing to migrate' "$RUNNER_TEMP/drizzle-generate.log"
          changes=$(git status --porcelain --untracked-files=all -- packages/db/drizzle/production)
          if [[ -n "$changes" ]]; then
            printf '%s\n' "$changes" >&2
            exit 1
          fi
      - name: Upload nightly dependency and migration results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-dependencies-and-migrations
          path: |
            ${{ runner.temp }}/dependency-audit.json
            ${{ runner.temp }}/drizzle-generate.log
          retention-days: 14

  browsers:
    name: Production browser / ${{ matrix.project }} / ${{ matrix.shard }} of 8
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        project: [firefox, mobile-chrome, webkit, mobile-safari]
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
        include:
          - { project: firefox, browser: firefox }
          - { project: mobile-chrome, browser: chromium }
          - { project: webkit, browser: webkit }
          - { project: mobile-safari, browser: webkit }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10.11.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Build component stories for Playwright
        run: pnpm --filter @barghsa/ui stories:build
      - name: Install browser runtimes
        run: pnpm --filter @barghsa/web exec playwright install --with-deps "${{ matrix.browser }}"
      - name: Verify browser selection and result handling
        run: |
          node --test scripts/browser-projects.test.mjs
          python3 -m unittest discover -s scripts -p 'test_check_browser_results.py'
      - name: Exercise the production app in the selected browser
        run: node scripts/run-production-browser.mjs --project "${{ matrix.project }}" --shard "${{ matrix.shard }}/8"
        env:
          BARGHSA_TEST_PREBUILT: '1'
      - name: Report observed browser outcomes
        if: always()
        run: python3 scripts/check-browser-results.py --input apps/web/test-results/results.json --report "${{ runner.temp }}/browser-outcomes.json"
      - name: Check known quarantines
        if: always()
        run: python3 scripts/check-flaky-tests.py --report "${{ runner.temp }}/quarantine.json"
      - name: Upload outcomes and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-${{ matrix.project }}-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/browser-outcomes.json
            ${{ runner.temp }}/quarantine.json
            apps/web/test-results/
          retention-days: 14
