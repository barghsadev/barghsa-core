name: Nightly browser checks
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packaging:
    name: Validate isolated Node runtime hardening
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify Compose rejects injected Node flags
        run: python3 scripts/test-container-packaging.py --compose-only
      - name: Build and inspect packaged runtime
        shell: bash
        run: |
          docker build -f Dockerfile.base --target production -t barghsa-packaging-app:fixture .
          docker build -f Dockerfile.web --target production --build-arg "BARGHSA_RELEASE_SHA=$GITHUB_SHA" -t barghsa-packaging-web:fixture .
          docker build -f packages/db/scripts/backup/Dockerfile -t barghsa-packaging-postgres:fixture .
          docker image inspect --format '{{.Id}} {{.Config.User}}' barghsa-packaging-app:fixture barghsa-packaging-web:fixture barghsa-packaging-postgres:fixture
      - name: Exercise app, web and worker in a disposable network
        env:
          BARGHSA_TEST_APP_IMAGE: barghsa-packaging-app:fixture
          BARGHSA_TEST_WEB_IMAGE: barghsa-packaging-web:fixture
          BARGHSA_TEST_POSTGRES_IMAGE: barghsa-packaging-postgres:fixture
        run: python3 scripts/test-container-packaging.py
