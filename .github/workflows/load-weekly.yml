name: Weekly isolated load checks

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: load-weekly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  load:
    name: Measure seven critical operations
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10.11.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build --filter=@barghsa/api
      - name: Install verified k6 runner
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          asset=k6-v2.3.0-linux-amd64.tar.gz
          curl --fail --silent --show-error --location --max-time 90 \
            --proto '=https' --proto-redir '=https' \
            "https://github.com/grafana/k6/releases/download/v2.3.0/$asset" --output "$asset"
          printf '%s  %s\n' '39c3117b6af817592dcd0ce4242105c0a7af10948c2a425306f0be8f7a8a8ab1' "$asset" | sha256sum -c
          tar -xzf "$asset"
          test -x "$RUNNER_TEMP/k6-v2.3.0-linux-amd64/k6"
          printf 'BARGHSA_K6_BIN=%s/k6-v2.3.0-linux-amd64/k6\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Run the load gate with migrated synthetic data
        env:
          BARGHSA_TEST_PREBUILT: '1'
          BARGHSA_TEST_POSTGRES_COMPOSE: '1'
          BARGHSA_PERFORMANCE_SHA: ${{ github.sha }}
          BARGHSA_PERFORMANCE_SMOKE: '0'
          BARGHSA_PERFORMANCE_REPORT: ${{ runner.temp }}/barghsa-performance.json
        run: pnpm --filter @barghsa/api exec vitest run --config vitest.performance.config.ts
      - name: Preserve measured latency and coverage counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-load-report
          path: ${{ runner.temp }}/barghsa-performance.json
          if-no-files-found: error
          retention-days: 30

  maintenance:
    name: Test financial mutations and report dependency updates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: '10.11.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install the pinned tools
        id: install
        run: pnpm install --frozen-lockfile
      - name: Run financial mutation testing
        env:
          BARGHSA_MUTATION_REPORT: ${{ runner.temp }}/financial-mutations.json
        run: |
          pnpm --filter @barghsa/shared exec stryker run
          jq -e '
            [.files[] | .mutants] | length == 3
            and all(.[]; any(.[]; .status == "Killed")
              and all(.[]; .status != "RuntimeError" and .status != "CompileError"))
          ' "$BARGHSA_MUTATION_REPORT"
      - name: Collect dependency update candidates
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          report="$RUNNER_TEMP/pnpm-outdated.json"
          errors="$RUNNER_TEMP/pnpm-outdated.stderr"
          status=0
          pnpm --recursive outdated --format=json --no-color > "$report" 2> "$errors" || status=$?
          if [[ $status -gt 1 || -s "$errors" ]]; then
            echo 'Dependency registry check failed' >&2
            exit 1
          fi
          jq -e --argjson status "$status" '
            type == "object" and (if $status == 1 then length > 0 else length == 0 end)
            and all(.[]; (.current | type) == "string" and (.latest | type) == "string")
          ' "$report"
          jq --arg revision "$GITHUB_SHA" '{source_sha: $revision, outdated: .}' \
            "$report" > "$RUNNER_TEMP/dependency-review.json"
      - name: Preserve mutation and dependency reports
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: weekly-maintenance-reports
          path: |
            ${{ runner.temp }}/financial-mutations.json
            ${{ runner.temp }}/dependency-review.json
          if-no-files-found: error
          retention-days: 30
