# Barghsa PostgreSQL Configuration — Local Development
#
# Tuned for the docker-compose.yml setup with WAL archiving to MinIO.
# Mounted into the postgres container as an additional config file.
#
# Memory sizing rule of thumb (for production, scale to host):
#   shared_buffers       = 25% of host RAM
#   effective_cache_size = 75% of host RAM
#   work_mem             = 32–64 MB per query
#   maintenance_work_mem = 256 MB – 1 GB
#
# wal_level must be at least 'replica' for WAL archiving to work.

# --- Connection Settings ---
max_connections = 100

# --- Memory Settings (tuned for 1–2 GB dev container) ---
shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 32MB
maintenance_work_mem = 256MB

# --- WAL Archiving ---
wal_level = replica
archive_mode = on
# WAL archiving script path inside the container (mounted volume)
archive_command = '/usr/local/bin/archive-wal.sh %f %p'
archive_timeout = 60

# --- Replication ---
max_wal_senders = 5
wal_keep_size = 512MB

# --- Checkpoint / Performance ---
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min
max_wal_size = 2GB
min_wal_size = 512MB

# --- I/O Timing ---
track_io_timing = on

# --- Logging ---
log_line_prefix = '%t [%p]: [%l-1] '
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 0
log_min_duration_statement = 200

# --- Autovacuum ---
autovacuum = on
autovacuum_naptime = 1min
autovacuum_vacuum_threshold = 50
autovacuum_vacuum_scale_factor = 0.2
autovacuum_vacuum_cost_delay = 20ms

# --- Query Monitoring (pg_stat_statements) ---
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = all
# Track I/O timing in pg_stat_statements
pg_stat_statements.track_utility = on
