# Barghsa Development Infrastructure
#
# Spins up all backing services required for local development:
#   - PostgreSQL 16 with PostGIS (primary database)
#   - Redis 7 (caching, rate limiting, session store)
#   - MinIO (S3-compatible object storage for file uploads & backups)
#   - MinIO bucket initialisation for backups
#
# Application containers (api, web) are built using ./Dockerfile.base
# and ./Dockerfile.web respectively and managed separately. The Docker
# Compose setup in this file is the backing infrastructure ONLY.
#
# Usage:
#   docker compose up -d            # Start all services
#   docker compose down -v          # Tear down (removes volumes)
#   docker compose ps               # Check health status

name: barghsa-dev

services:
  # ─────────────────────────────────────────────────────────────
  # PostgreSQL 16 with PostGIS
  # ─────────────────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.5
    container_name: barghsa-postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: barghsa
      POSTGRES_USER: barghsa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-barghsa-dev-password}
      # WAL archiving and backup environment
      BACKUP_S3_ENDPOINT: http://minio:9000
      BACKUP_S3_BUCKET: barghsa-backups
      BACKUP_S3_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      BACKUP_S3_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin-dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-config/barghsa-postgres.conf:/etc/postgresql/postgresql.conf.d/99-barghsa.conf:ro
      - ./packages/db/scripts/backup/archive-wal.sh:/usr/local/bin/archive-wal.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U barghsa']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────
  # PgBouncer — PostgreSQL connection pooler
  # ─────────────────────────────────────────────────────────────
  pgbouncer:
    image: bitnamilegacy/pgbouncer:1.23.1
    container_name: barghsa-pgbouncer
    profiles: [pooling]
    ports:
      - '6432:6432'
    environment:
      PGBOUNCER_DATABASE: barghsa
      PGBOUNCER_PORT: '6432'
      PGBOUNCER_POOL_MODE: transaction
      POSTGRESQL_HOST: postgres
      POSTGRESQL_PORT: '5432'
      POSTGRESQL_DATABASE: barghsa
      POSTGRESQL_USERNAME: barghsa
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD:-barghsa-dev-password}
      PGBOUNCER_MAX_CLIENT_CONN: '200'
      PGBOUNCER_DEFAULT_POOL_SIZE: '30'
      PGBOUNCER_RESERVE_POOL_SIZE: '10'
      PGBOUNCER_RESERVE_POOL_TIMEOUT: '3'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          PGPASSWORD="$${POSTGRESQL_PASSWORD}" psql -h 127.0.0.1
          -p "$${PGBOUNCER_PORT}" -U "$${POSTGRESQL_USERNAME}"
          -d "$${PGBOUNCER_DATABASE}" -v ON_ERROR_STOP=1 -Atqc 'SELECT 1' >/dev/null
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────
  # Redis 7 — caching, rate limiting, session store
  # ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: barghsa-redis
    ports:
      - '6379:6379'
    # No persistent volume — Redis is a cache; loss is acceptable in dev.
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────
  # MinIO — S3-compatible object storage
  # ─────────────────────────────────────────────────────────────
  minio:
    image: minio/minio
    container_name: barghsa-minio
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # Web console
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin-dev}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────
  # MinIO Bucket Init — creates required buckets on startup
  # ─────────────────────────────────────────────────────────────
  minio-init:
    image: minio/mc
    container_name: barghsa-minio-init
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin-dev}
      MINIO_BUCKET: ${MINIO_BUCKET:-barghsa}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-barghsa-backups}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$${MINIO_ACCESS_KEY}" "$${MINIO_SECRET_KEY}"
        mc mb --ignore-existing "local/$${MINIO_BUCKET}" "local/$${BACKUP_S3_BUCKET}"
        mc anonymous set none "local/$${MINIO_BUCKET}"
        mc anonymous set none "local/$${BACKUP_S3_BUCKET}"
    depends_on:
      minio:
        condition: service_healthy

volumes:
  pgdata:
    name: barghsa-pgdata
  minio-data:
    name: barghsa-minio-data
